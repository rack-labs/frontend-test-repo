<!doctype html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport"
    content="width=device-width,
        initial-scale=1.0,
        maximum-scale=5.0,
        minimum-scale=1.0,
        user-scalable=yes" />
    <meta name="description" content="1만 시간의 법칙 - 전문가가 되기 위한 훈련 시간 계산기" />
    <title>1만 시간의 법칙</title>

    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
    <div class="page-wrapper">
        <main>
            <section class="hero">
                <h2 class="sr-only">소개</h2>
                <figure class="hero-img">
                    <img class="hero-title" src="./img/title.png" alt="1만 시간의 법칙"/>
                    <img class="hero-clock" src="./img/clock.png" alt="" />
                </figure>
                <p class="hero-say">
                    "연습은 어제의 당신보다 당신을 더 낫게 만든다."
                </p>
            </section>
            <section class="description">
                <h2 class="sr-only">1만 시간의 법칙 설명</h2>
                <blockquote class="description-inner">
                    <img class="description-quote-open" src="./img/%E2%80%9C.png" alt="" />
                    <p class="description-text">
                        <span>1만 시간의 법칙</span>은 <br />
                        어떤 분야의 전문가가 되기 위해서는 <br />
                        최소한 1만 시간의 훈련이 필요하다는 법칙이다.
                    </p>
                    <img class="description-quote-close" src="./img/%E2%80%9D.png" alt="" />
                </blockquote>
            </section>
            <section class="aim">
                <h2 class="sr-only">훈련 시간 계산기</h2>
                <fieldset class="aim-input">
                    <legend class="sr-only">훈련 목표 입력</legend>
                    <label class="aim-label aim-label-goal">
                        <span>나는</span>
                        <input class="aim-label-goal" type="text" placeholder="예&#41;프로그래밍" aria-label="목표 분야 입력">
                        <span>전문가가 될 것이다.</span>
                    </label>
                    <br>
                    <label class="aim-label aim-label-time">
                        <span>그래서 앞으로 매일 하루에</span>
                        <input class="aim-label-time" type="text" placeholder="예&#41;5시간" aria-label="하루 훈련 시간 입력">
                        <span>시간씩 훈련할 것이다.</span>
                    </label>
                </fieldset>
                <div class="aim-submit">
                    <button class="btn btn-calculate">
                        나는 며칠 동안 훈련을 해야 1만 시간이 될까?
                    </button>
                    <img src="./img/click.png" alt="" />
                </div>
                <output class="aim-output" aria-live="polite">
                    <p class="aim-result-row-goal">
                        <span>당신은</span>
                        <span class="aim-result-goal">프로그래밍</span>
                        <span>전문가가 되기 위해서</span>
                    </p>
                    <p class="aim-result-row-days">
                        <span>대략</span>
                        <span class="aim-result-days">5110</span>
                        <span>일 이상 훈련하셔야 합니다! :&#41</span>
                    </p>
                </output>
            </section>
            <section class="action">
                <h2 class="sr-only">훈련 시작</h2>
                <button class="btn btn-primary" onclick="openModal()">
                    훈련하러 가기 GO! GO!
                </button>
                <button class="btn btn-secondary">
                    공유하기
                </button>
            </section>
        </main>
        <footer>
            <img class="footer-logo" src="./img/weniv.png" alt="weniv 로고">
            <p class="copyright">
                ※ 본 서비스 내 이미지 및 콘텐츠의 저작권은 주식회사 WeNiv에 있습니다. <br> 수정 및 재배포, 무단 도용 시 법적인 문제가 발생할 수 있습니다.
            </p>
        </footer>
    </div>
    <dialog class="cheer-page" id="cheerPage" role="dialog" aria-modal="true" aria-labelledby="cheerTitle">
        <div class="cheer-box">
            <h2 class="cheer-title" id="cheerTitle">화이팅!!♥♥♥</h2>
            <p class="cheer-subtitle">당신의 꿈을 응원합니다!</p>
            <img class="cheer-img" src="./img/라이캣.png" alt="응원 캐릭터 라이캣" />
            <button class="btn cheer-btn" onclick="closeCheer()">
                종료하고 진짜 훈련하러 가기 GO!GO!
            </button>
        </div>
    </dialog>

    <script>
        function openModal() {
    document.getElementById('cheerPage').showModal();
}
        function closeCheer() {
    document.getElementById('cheerPage').close();
}
    </script>
</body>
</html>
