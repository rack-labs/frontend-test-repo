<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mhr-hero-harness</title>
<style>html, body { margin: 0; background: #0b0d10; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
/* Step 2 of the hero render: plays the exported MHR body (data/ from
   export_mhr.py) on a floor grid in the landing page's palette. Serve this
   folder over http (three.module.js copied beside it, see README) and open
   ?play=1 to preview; capture.mjs drives it frame by frame. Not product code.
   ?w=&h=        canvas size (pixel ratio 1)
   ?frame=N      first frame to draw (0-based within the exported range)
   ?play=1       run at 30 fps in the browser (preview)
   ?theta=&phi=&radius=&fov=&ty=&dx=   camera tuning (radians / cm)
   window.__setFrame(i) draws frame i and resolves when rendered; window.__ready after load. */
import * as THREE from './three.module.js';
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
const W = num('w', 1440), H = num('h', 1200);

const meta = await (await fetch('data/meta.json')).json();
const bytes = async (p) => (await fetch(p)).arrayBuffer();
const faces = new Uint32Array(await bytes('data/faces.u32'));
const verts = new Int16Array(await bytes('data/verts.i16'));
const joints = new Float32Array(await bytes('data/joints.f32'));
const V = meta.nVertices, F = meta.frames, NJ = meta.names.length;

const BG = 0x0b0d10;
const C = { grid: 0x222a35, major: 0x36424f, mesh: 0xb9c7d6, bone: 0x8fbcbc, joint: 0xcfe6e6, shadow: 0x000000 };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true, stencil: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(BG, 350, 1100);   // grid only; body materials opt out

/* floor: 20 cm grid, a heavier line every metre */
{
  const minor = [], major = [];
  for (let v = -600; v <= 600; v += 20) {
    const arr = (v % 100 === 0) ? major : minor;
    arr.push(new THREE.Vector3(v, 0, -600), new THREE.Vector3(v, 0, 600));
    arr.push(new THREE.Vector3(-600, 0, v), new THREE.Vector3(600, 0, v));
  }
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(minor), new THREE.LineBasicMaterial({ color: C.grid })));
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(major), new THREE.LineBasicMaterial({ color: C.major })));
}

/* lights reach the mesh only (lines and points use Basic materials) */
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7280, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); scene.add(sun);   // placed beside the camera below

/* body mesh: faces once, vertices per frame; translucent, front faces only */
const geo = new THREE.BufferGeometry();
geo.setIndex(new THREE.BufferAttribute(faces, 1));
const pos = new THREE.BufferAttribute(new Float32Array(V * 3), 3); pos.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('position', pos);
const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: C.mesh, transparent: true, opacity: 0.55, fog: false }));
mesh.frustumCulled = false; scene.add(mesh);
/* contact shadow: the same geometry squashed onto the floor, stencil so overlaps paint once */
const shadow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: C.shadow, transparent: true, opacity: 0.35, depthWrite: false,
  side: THREE.DoubleSide, fog: false, stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc, stencilZPass: THREE.ReplaceStencilOp }));
shadow.scale.set(1, 0, 1); shadow.position.y = 0.3; shadow.frustumCulled = false; scene.add(shadow);

/* the 29 body joints and their parents, drawn inside the mesh */
const jGeo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: NJ }, () => new THREE.Vector3()));
const dot = document.createElement('canvas'); dot.width = dot.height = 32;
{ const g = dot.getContext('2d'); g.fillStyle = '#fff'; g.beginPath(); g.arc(16, 16, 14, 0, Math.PI * 2); g.fill(); }
const dotTex = new THREE.CanvasTexture(dot);
const jPts = new THREE.Points(jGeo, new THREE.PointsMaterial({ color: C.joint, size: 2.6, sizeAttenuation: true, map: dotTex, alphaMap: dotTex, alphaTest: 0.5, fog: false }));
jPts.renderOrder = -1; scene.add(jPts);
let nb = 0; meta.parents.forEach(p => { if (p >= 0) nb++; });
const bGeo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: nb * 2 }, () => new THREE.Vector3()));
const bones = new THREE.LineSegments(bGeo, new THREE.LineBasicMaterial({ color: C.bone, fog: false }));   // opaque: drawn before the translucent mesh, so it shows through
bones.renderOrder = -1; scene.add(bones);

/* camera: three-quarter view from the front right, a little above hip height */
const root = []; for (let i = 0; i < F; i++) root.push([joints[(i * NJ) * 3], joints[(i * NJ) * 3 + 2]]);
const cx = root.reduce((a, r) => a + r[0], 0) / F, cz = root.reduce((a, r) => a + r[1], 0) / F;
const cam = new THREE.PerspectiveCamera(num('fov', 30), W / H, 1, 5000);
const target = new THREE.Vector3(cx + num('dx', 0), num('ty', 84), cz);
const theta = num('theta', 3.6), phi = num('phi', 1.34), radius = num('radius', 425);
cam.position.set(target.x + radius * Math.sin(phi) * Math.sin(theta), target.y + radius * Math.cos(phi), target.z + radius * Math.sin(phi) * Math.cos(theta));
cam.lookAt(target);
sun.position.copy(cam.position).add(new THREE.Vector3(-150, 250, 0));
window.__cam = { cx, cz, theta, phi, radius };

const tmp = new Float32Array(V * 3);
function setFrame(i, j, t) {
  i = ((i % F) + F) % F;
  const o = i * V * 3, mix = (j != null && t > 0), oj = mix ? (((j % F) + F) % F) * V * 3 : 0, u = mix ? 1 - t : 1;
  for (let k = 0; k < V * 3; k++) tmp[k] = (mix ? verts[o + k] * u + verts[oj + k] * t : verts[o + k]) * 0.1;
  pos.array.set(tmp); pos.needsUpdate = true;
  geo.computeVertexNormals();
  const jp = jGeo.attributes.position, bp = bGeo.attributes.position; let m = 0;
  const jo = i * NJ * 3, jj = mix ? (((j % F) + F) % F) * NJ * 3 : 0;
  const J = (k) => mix ? joints[jo + k] * u + joints[jj + k] * t : joints[jo + k];
  for (let q = 0; q < NJ; q++) {
    jp.setXYZ(q, J(q * 3), J(q * 3 + 1), J(q * 3 + 2));
    const p = meta.parents[q];
    if (p >= 0) { bp.setXYZ(m++, J(q * 3), J(q * 3 + 1), J(q * 3 + 2)); bp.setXYZ(m++, J(p * 3), J(p * 3 + 1), J(p * 3 + 2)); }
  }
  jp.needsUpdate = bp.needsUpdate = true;
  renderer.render(scene, cam);
  return i;
}
window.__setFrame = (i, j, t) => new Promise(r => { setFrame(i, j, t || 0); requestAnimationFrame(() => r(i)); });
window.__frames = F;

let cur = num('frame', 0);
setFrame(cur);
if (q.get('play') === '1') {
  const t0 = performance.now(), f0 = cur;
  const tick = () => { setFrame(f0 + Math.floor((performance.now() - t0) / 1000 * 30)); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
window.__ready = true;
</script>
</body>
</html>
