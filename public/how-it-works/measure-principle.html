<title>측정 산출 원리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 「렌즈 보정 산출 원리」와 같다. 3D 뷰(격벽 뷰어)가 화면 전체, 단계 탭과 시점 버튼은 위, 재생기(자막·진행 막대·버튼)는 아래 가운데.
   C1 이 보는 이미지는 오른쪽 위 작은 창. 밝은 테마 하나로 고정한다 */
:root{
  --bg:#e9edf2; --panel:#ffffff; --pane:#f2f5f8; --grid:#c9d2db; --edge:#aeb9c4;
  --fg:#1b1f27; --muted:#5b6270; --line:#d5dce4; --accent:#1f5fb0; --spike:#1b1f27;
  --rack:#6b7480; --person:#9aa3ad; --px:#d2571f; --pt:#d2571f; --joint:#1b1f27; --metric:#1f8a5b; --load:#a8307f; --anchor:#c99400; --tri:#7a838f;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;padding:0;background:var(--panel);color:var(--fg);font:14px/1.5 var(--font);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{position:fixed;inset:0}
.v3d{position:absolute;inset:0;background:var(--panel);overflow:hidden;touch-action:none}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov .tick{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 10.5px/1 var(--mono);color:var(--muted);will-change:transform}
.ov .ttl{font-weight:700;color:var(--fg)}
.ov .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 11px/1.2 var(--mono);padding:2px 4px;color:var(--fg);will-change:transform,opacity}
.ov .lbl.k{font-weight:500;color:var(--muted)}
.ov .lbl.rep{font-size:13px;padding:3px 7px;border-radius:5px;background:var(--fg);color:#fff}
.ov .lead{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ov .lead line{stroke-width:1.2;opacity:.8}
.ov .lead circle{opacity:.9}
.ov .tip{position:absolute;left:0;top:0;display:none;z-index:3;padding:6px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 11px/1.45 var(--mono);white-space:nowrap}
.ov .tip div+div{color:var(--muted);font-weight:500}

/* 위: 단계 탭(왼쪽) · 시점(오른쪽). 좁으면 두 줄로 */
.top{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top,0px));left:0;right:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);font-weight:500;font-size:13px;display:flex;gap:7px;align-items:center}
.tabs button b{font:600 11px/1 var(--mono);color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs button[aria-selected="true"] b{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.seg button{padding:6px 11px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[disabled]{opacity:.45;cursor:default}

/* 오른쪽 위: C1 이 보는 이미지. 시점 버튼 아래. 좁은 화면에서는 숨긴다.
   C1 은 센서의 긴 변이 위아래가 되게 세로로 달려 있어서(R 의 x 축이 바닥 쪽) 사진을 세워서 보여 준다 */
.inset{position:absolute;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 46px);
  width:min(176px,19vw);aspect-ratio:1200/1920;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--pane)}
.inset canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.inset .tag{position:absolute;left:7px;top:5px;font:600 10.5px/1 var(--mono);color:var(--muted);pointer-events:none}
@media (max-width:640px){ .inset{display:none} }

/* 아래: 재생기 */
.player{position:absolute;z-index:5;left:0;right:0;bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none}
.card{pointer-events:auto;width:min(760px,100%);min-width:0;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px 12px;display:grid;gap:8px;box-shadow:0 2px 12px rgba(27,31,39,.10)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:600 11px/1 var(--mono);color:var(--muted)}
.meta .file{padding:3px 6px;border-radius:4px;background:var(--pane);color:var(--fg);font-weight:500}
.meta .hint{margin-left:auto;font-weight:500}
.cap{font-size:14px;line-height:1.5;min-height:3em;text-wrap:pretty;max-width:62ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.ctl button{padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.ctl button:last-child{border-right:0}
.ctl button[disabled]{opacity:.4;cursor:default}
.ctl .play{min-width:78px;font-weight:600;background:var(--accent);color:#fff}
.bar{flex:1;min-width:180px;display:flex;gap:7px;height:14px;align-items:stretch}
.bar .st{display:flex;gap:2px;flex:var(--w) 1 0;min-width:0}
.bar .sg{flex:var(--d) 1 0;min-width:4px;padding:0;background:var(--line);border-radius:2px;position:relative;overflow:hidden;display:block}
.bar .sg i{position:absolute;inset:0;width:0;background:var(--accent);display:block}
.bar .sg[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--accent)}

/* 영상 저장용(?video=1): 단계 탭·시점·진행 막대·버튼·안내를 다 숨기고 자막 카드와 이미지 창만 남긴다 */
body.video .top,body.video .row,body.video .hint{display:none}
body.video .v3d{bottom:124px}
body.video .inset{top:12px;right:12px}
body.video .card{background:none;border:0;box-shadow:none;width:min(1100px,100%);padding:0 0 14px;gap:8px;justify-items:center;text-align:center}
body.video .meta{font-size:13px;justify-content:center}
body.video .meta .file{background:none;padding:0;color:var(--muted)}
body.video .cap{font-size:20px;line-height:1.55;min-height:0;max-width:none;text-align:center;text-wrap:balance}
/* 사이트 끼워 넣기용(?embed=1&bg=eceef1): 탭·시점·단계 이름·버튼·안내를 숨기고, 얇은 진행 막대 하나와 상자 없는 자막만 남긴다.
   바탕은 ?bg= 로 받아 섹션과 같은 색으로 그린다. 끝나면 처음부터 다시 돌고, 화면 밖에 있는 동안은 멈춘다 */
body.embed{background:var(--bg)}
body.embed .v3d{background:transparent;bottom:92px}
body.embed .top,body.embed .meta,body.embed .ctl{display:none}
body.embed .inset{top:12px;right:12px}
body.embed .player{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
body.embed .card{background:none;border:0;box-shadow:none;width:min(820px,100%);padding:0;gap:10px;justify-items:center;text-align:center}
body.embed .cap{display:grid;align-content:end;font-size:1.125rem;word-break:keep-all;line-height:1.5;min-height:3em;max-width:none;text-align:center;text-wrap:balance}
body.embed .row{width:100%}
body.embed .bar{gap:0;height:3px;min-width:0;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--fg) 12%,transparent)}
body.embed .bar .st{gap:0}
body.embed .bar .sg{min-width:0;border-radius:0;background:transparent}
body.embed .bar .sg[aria-current="true"]{box-shadow:none}
@media (max-width:560px){ body.embed .v3d{bottom:112px} body.embed .cap{min-height:4.5em} }
.err{display:flex;align-items:center;justify-content:center;height:100%;font:600 12px/1.4 var(--mono);color:var(--muted);padding:16px;text-align:center}
</style>

      });
      /* 격벽 범위: 장면이 주면 그대로(이 페이지는 고정 — 비트가 바뀌어도 눈금이 안 튄다), 없으면 bbox 에서 */
      let R, step;
      if (Sn.range) { R = Sn.range; step = Sn.step || pickStep(Math.max(R.x[1] - R.x[0], R.y[1] - R.y[0], R.z[1] - R.z[0])); }
      else {
        const bb = S.bbox, span = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z, 40);
        step = pickStep(span * 1.16); const pad = span * 0.08;
        const lo = v => Math.floor((v - pad) / step) * step, hi = v => Math.ceil((v + pad) / step) * step;
        R = { x: [lo(bb.min.x), hi(bb.max.x)], y: [bb.min.y >= -pad ? 0 : lo(bb.min.y), hi(bb.max.y)], z: [lo(bb.min.z), hi(bb.max.z)] };
      }
      const key = ['x', 'y', 'z'].map(a => R[a].join(':')).join('|');
      if (!W || W.key !== key) { buildWalls(R, step); needFit = true; }
      picked = null; tip.style.display = 'none'; W.spike.visible = W.marker.visible = false;
      if (keep) { const o = S.pickables.find(p => p.userData.name === keep.name); if (o) { const u = o.userData; showPick({ p: u.center ? u.center.clone() : o.position.clone(), name: u.name, extra: u.extra || null, color: u.color, sticky: keep.sticky }); } }
      fit();
    },
  };
}

/* ═══════════════════ 장면 만들기 ═══════════════════
   빌더. 모든 도형은 cur(기본 G)에 들어간다. grouped() 로 묶으면 묶음째 fade 할 수 있다.
   reveal = [시작 초, 길이 초]. 화살표·광선은 자라고(draw-on), 나머지는 투명도로 나타난다. 없으면 처음부터 놓여 있다 */
function sceneBuilder() {
  const G = new THREE.Group(), labels = [], pickables = [], anims = [], bb = new THREE.Box3();
  let cur = G;
  const V = p => new THREE.Vector3(p[0], p[1], p[2]);
  const grow = p => bb.expandByPoint(V(p));
  const col = c => c instanceof THREE.Color ? c : new THREE.Color(c.startsWith('--') ? css(c) : c);
  const colStr = c => typeof c === 'string' && !c.startsWith('--') ? c : css(c);
  const UP = new THREE.Vector3(0, 1, 0);
  const mats = obj => { const o = []; obj.traverse(x => { if (x.material) { const m = x.material; if (m.userData.base === undefined) m.userData.base = m.opacity; m.transparent = true; o.push(m); } }); return o; };
  const b = {
    G, labels, pickables, anims, bb, V,
    anim(fn) { anims.push(fn); },
    fade(obj, reveal, { out = false } = {}) {
      const ms = mats(obj);
      anims.push(t => { let k = prog(t, reveal); if (out) k = 1 - k; obj.visible = k > 0.001; ms.forEach(m => { m.opacity = m.userData.base * k; }); });
    },
    /* 나타났다가 사라진다: [시작, 나타나는 길이, 머무는 길이, 사라지는 길이] */
    pulse(obj, [s, din, hold, dout]) {
      const ms = mats(obj);
      anims.push(t => { const k = prog(t, [s, din]) * (1 - prog(t, [s + din + hold, dout])); obj.visible = k > 0.001; ms.forEach(m => { m.opacity = m.userData.base * k; }); });
    },
    grouped(fn, reveal = null, out = false) {
      const g = new THREE.Group(), prev = cur;
      cur.add(g); cur = g; fn(g); cur = prev;
      if (reveal) b.fade(g, reveal, { out });
      return g;
    },
    label(text, pos, o = {}) { const l = { text, pos: V(pos), cls: o.cls, color: o.color, pin: !!o.pin, reveal: o.reveal || null, id: o.id || null }; labels.push(l); return l; },
    lines(pairs, color, { dashed = false, opacity = 1, reveal = null, r = 0.4 } = {}) {
      const P = pairs.map(([a, c]) => { grow(a); grow(c); return [V(a), V(c)]; });
      const sg = new Segs(cur, col(color), { opacity, r, dashed }).update(P);
      if (reveal) anims.push(t => { const k = easeOut(prog(t, reveal)); sg.update(P.map(([a, c]) => [a, a.clone().lerp(c, k)])); sg.g.visible = k > 0; });
      return sg;
    },
    arrowDyn(a, c, color, { dashed = false, thick = false, head = null, opacity = 1 } = {}) {
      const C = col(color), g = new THREE.Group(); cur.add(g);
      const shaftR = thick ? 0.85 : 0.42;
      let shaft = null, segs = null;
      if (dashed) segs = new Segs(g, C, { opacity, r: shaftR, dashed: true, dash: 4, gap: 2.5 });
      else { shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, 1, 8), new THREE.MeshBasicMaterial({ color: C, transparent: true, opacity })); g.add(shaft); }
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 12), new THREE.MeshBasicMaterial({ color: C, transparent: true, opacity }));
      g.add(cone);
      const A = new THREE.Vector3(), Bv = new THREE.Vector3(), dir = new THREE.Vector3(), end = new THREE.Vector3();
      let len = 0, h = 0, w = 0, frac = 1, opa = opacity;
      const api = {
        g,
        aim(p, q) {
          A.copy(V(p)); Bv.copy(V(q)); dir.copy(Bv).sub(A); len = dir.length(); if (len > 1e-6) dir.divideScalar(len);
          h = head ?? Math.min(len * 0.28, thick ? 10 : 7); w = thick ? h * 0.5 : h * 0.42;
          grow(p); grow(q); api.set(frac, opa); return api;
        },
        set(f, o = opa) {
          frac = f; opa = o; const L = len * f;
          g.visible = L > 0.3 && o > 0.005; if (!g.visible) return;
          const hh = Math.min(h, L), sl = Math.max(0, L - hh);
          end.copy(A).addScaledVector(dir, sl);
          if (segs) { segs.update([[A, end]]); segs.mat.opacity = o; segs.mat.transparent = true; }
          else { shaft.scale.set(1, Math.max(sl, 0.01), 1); shaft.position.copy(A).addScaledVector(dir, sl / 2); shaft.quaternion.setFromUnitVectors(UP, dir); shaft.material.opacity = o; }
          cone.scale.set(w / 2, hh, w / 2); cone.position.copy(end).addScaledVector(dir, hh / 2); cone.quaternion.setFromUnitVectors(UP, dir);
          cone.material.opacity = o;
        },
      };
      return api.aim(a, c);
    },
    arrow(a, c, color, o = {}) {
      const { reveal = null, ...rest } = o;
      const ar = b.arrowDyn(a, c, color, rest);
      if (reveal) anims.push(t => ar.set(easeOut(prog(t, reveal))));
      return ar;
    },
    dot(p, color, r = 2.6, info = null, { reveal = null, opacity = 1 } = {}) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 14), new THREE.MeshBasicMaterial({ color: col(color), transparent: opacity < 1, opacity }));
      m.position.copy(V(p)); cur.add(m); grow(p);
      if (info) { m.userData = { ...info, color: colStr(color) }; pickables.push(m); }
      if (reveal) b.fade(m, reveal);
      return m;
    },
    quad(q, color, { opacity = 0.3, dashed = false, info = null, reveal = null, edge = true } = {}) {
      const P = q.map(V); q.forEach(grow);
      const g = new THREE.Group(); cur.add(g);
      const geo = new THREE.BufferGeometry().setFromPoints(P); geo.setIndex([0, 1, 2, 0, 2, 3]);
      const C = col(color);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: C, side: THREE.DoubleSide, transparent: true, opacity, depthWrite: false }));
      g.add(mesh);
      if (edge) new Segs(g, C, { r: 0.35, dashed }).update(P.map((p, i) => [p, P[(i + 1) % 4]]));
      if (info) { const center = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(0.25); mesh.userData = { ...info, center, color: colStr(color) }; pickables.push(mesh); }
      if (reveal) b.fade(g, reveal);
      return g;
    },
    triad(o, axes, len, names, { cls = 'k', reveal = null } = {}) {
      const cols = ['#c0392b', '#1e8449', '#1f5fb0'];
      const lr = reveal ? [reveal[0] + reveal[1] * 0.7, reveal[1] * 0.4] : undefined;
      axes.forEach((ax, i) => { const e = add(o, mul(unit(ax), len)); b.arrow(o, e, cols[i], { head: Math.min(5, len * 0.3), reveal }); b.label(names[i], add(o, mul(unit(ax), len * 1.18)), { cls, color: cols[i], pin: true, reveal: lr }); });
    },
    /* 카메라: 광학 중심 · 시야 피라미드 · 이미지 평면(광학 중심에서 28 cm) */
    camera(c) {
      const pairs = c.corners.map(k => [c.C, k]).concat(c.corners.map((k, i) => [k, c.corners[(i + 1) % 4]]));
      b.lines(pairs, c.color, { opacity: 0.9, r: 0.3 });
      b.quad(c.corners, c.color, { opacity: 0.07, edge: false, info: { name: `${c.unit} 이미지 평면`, extra: `${IMG_W}×${IMG_H} px · 광학 중심에서 ${PLANE_D} cm 앞에 그렸다` } });
      b.dot(c.C, c.color, 2.4, { name: c.ref ? `기준 카메라 ${c.unit}` : c.unit, extra: `바닥 좌표 ${vec(c.C)} cm · 높이 ${fmt(c.C[1], 0)} cm` });
      b.label(c.unit, c.C, { color: c.color, cls: 'k' });
    },
    /* 파워랙 모형 — 리그 배치 렌더와 같은 부재 배치. 랙 좌표로 만들어 그룹째 c·yaw 로 옮긴다 */
    rack({ faint = true, origin = false } = {}) {
      const S = RACK, U = S.u, CS = S.cs, H = S.H, Wi = S.Wi, Di = S.Di;
      const g = new THREE.Group(); g.position.set(RACK_O[0], 0, RACK_O[2]); g.rotation.y = -yaw; cur.add(g);
      const edges = [];
      const bx = (w, h, d, [x, y, z]) => {
        const eg = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)), a = eg.attributes.position.array; eg.dispose();
        for (let i = 0; i + 5 < a.length; i += 6) edges.push([new THREE.Vector3(a[i] + x, a[i + 1] + y, a[i + 2] + z), new THREE.Vector3(a[i + 3] + x, a[i + 4] + y, a[i + 5] + z)]);
      };
      const cw = Wi / 2 + U / 2, cd = Di / 2 + U / 2;
      const corners = [[-cw, -cd], [cw, -cd], [cw, cd], [-cw, cd]];
      corners.forEach(([x, z]) => bx(U, H, U, [x, H / 2, z]));
      for (let k = 0; k < 4; k++) {
        const [ax, az] = corners[k], [qx, qz] = corners[(k + 1) % 4];
        const span = Math.hypot(qx - ax, qz - az) - U, horiz = Math.abs(qz - az) < 1e-6;
        bx(horiz ? span : CS, CS, horiz ? CS : span, [(ax + qx) / 2, H - CS / 2, (az + qz) / 2]);
      }
      [-1, 1].forEach(sx => bx(CS, CS, 2 * cd - U, [sx * cw, CS / 2, 0]));
      [-1, 1].forEach(sx => {
        bx(S.jcupW, S.jcupH, S.jcupReach, [sx * (cw + U / 2 - S.jcupW / 2), S.jcupHeight, -(cd + U / 2 - S.jcupReach / 2 + S.jcupNose)]);
        bx(S.safetyW, S.safetyT, 2 * cd - U, [sx * cw, S.safetyHeight, 0]);
      });
      const gap = S.storage, szc = -(cd + U / 2) - gap - U / 2;
      [-1, 1].forEach(sx => { bx(U, H, U, [sx * cw, H / 2, szc]); bx(CS, CS, gap, [sx * cw, CS / 2, -(cd + U / 2) - gap / 2]); bx(CS, CS, gap, [sx * cw, H - CS / 2, -(cd + U / 2) - gap / 2]); });
      bx(2 * cw - U, CS, CS, [0, H - CS / 2, szc]);
      new Segs(g, col(faint ? '--grid' : '--rack'), { opacity: faint ? 0.55 : 0.8, r: 0.32 }).update(edges);
      const inner = [[-Wi / 2, 0.4, Di / 2], [Wi / 2, 0.4, Di / 2], [Wi / 2, 0.4, -Di / 2], [-Wi / 2, 0.4, -Di / 2]].map(r2f);
      b.lines(inner.map((p, i) => [p, inner[(i + 1) % 4]]), faint ? '--grid' : '--rack', { dashed: true, opacity: faint ? 0.6 : 0.9 });
      if (origin) b.dot(RACK_O, '--rack', 2.2, { name: '랙 원점', extra: '케이지 안쪽 면 네 개가 만드는 사각형의 중심 · 바닥 · 랙 앵커 파일의 원점' });
    },
  };
  return b;
}

/* 비트별 장면. 같은 단계의 앞 비트에서 산출된 것은 다 놓인 채로 두고, 이 비트에서 산출되는 것만 reveal 을 단다 */
let FIG = null;
function buildScene(bt) {
  const b = sceneBuilder(), S = bt.stage, K = bt.key, V3 = b.V;
  const Fg = mkFigure(); FIG = Fg;
  if (K === 'rep') b.anim(t => Fg.set(kOf(t)));                                 // 반복 비트: 자세가 시간을 따라 움직이고, 아래 모든 갱신기가 따라간다
  const midOf = (a, c) => mul(add(a, c), 0.5);
  const setText = (id, txt) => { const el = document.querySelector(`.ov .lbl[data-id="${id}"]`); if (el && el.textContent !== txt) el.textContent = txt; };
  const jointInfo = j => ({ name: JOINT[j], extra: `랙 좌표 ${vec(f2r(Fg.T[j]))} cm · 본 카메라 3대 · 재투영 오차 최대 ${fmt(Math.max(...Fg.E[j]), 1)} px` });
  const pairsOf = (pts, bones) => bones.map(([i, j]) => [pts[i], pts[j]]);
  const vpairs = (pts, bones) => bones.map(([i, j]) => [V3(pts[i]), V3(pts[j])]);
  const setPos = (m, p) => m.position.set(p[0], p[1], p[2]);

  /* 먼저 있던 것: 랙 · 카메라 세 대와 이미지 평면 · 사람(측정 전의 실제 몸 — 옅은 회색) */
  b.rack({ faint: true, origin: S === 4 });
  CAMS.forEach(c => b.camera(c));
  const person = {};
  {
    const sg = b.lines(pairsOf(Fg.P, BONES_BODY), '--person', { opacity: 0.35, r: 1.5 });
    const head = b.dot(headOf(Fg.P), '--person', 7.5, { name: '사람', extra: '측정 전의 실제 몸 · 자세는 예시(뼈 길이와 관절 각도로 만듦)' }, { opacity: 0.35 });
    Fg.on(() => { sg.update(vpairs(Fg.P, BONES_BODY)); setPos(head, headOf(Fg.P)); });
    person.sg = sg; person.head = head;
  }

  /* 이미지 평면 위 2D 관절(카메라마다) — 1 단계 '2D 관절'에서 카메라 순서로 나타나고, 그 뒤로는 놓여 있다 */
  const planes2d = (reveal = null) => CAMS.forEach(c => b.grouped(() => {
    const O = Fg.O[c.i];
    const dots = O.map((o, j) => b.dot(o.pt, '--px', j === FEAT ? 0.9 : 0.55));
    const sg = b.lines(pairsOf(O.map(o => o.pt), BONES), '--px', { r: 0.14, opacity: 0.8 });
    Fg.on(() => { const O2 = Fg.O[c.i]; dots.forEach((d, j) => setPos(d, O2[j].pt)); sg.update(vpairs(O2.map(o => o.pt), BONES)); });
  }, reveal ? [PLANE_S(c.i), reveal] : null));
  const featInfo = c => { const o = Fg.O[c.i][FEAT]; return { name: `${JOINT[FEAT]} 픽셀 (${c.unit})`, extra: `(${fmt(o.u, 0)}, ${fmt(o.v, 0)}) px → 정규화 (${fmt(o.x, 3)}, ${fmt(o.y, 3)})` }; };
  const featOnPlanes = (reveal = null) => CAMS.forEach(c => b.dot(Fg.O[c.i][FEAT].pt, '--pt', 1.2, featInfo(c), { reveal }));
  const rayEnd = (c, j) => { const o = Fg.O[c.i][j]; return add(c.C, mul(unit(sub(o.pt, c.C)), nrm(sub(Fg.T[j], c.C)) + 30)); };
  const rays = (j, { reveal = null, stagger = 0.5, opacity = 0.95, r = 0.45 } = {}) => CAMS.map(c => b.lines([[c.C, rayEnd(c, j)]], c.color, { r, opacity, reveal: reveal ? [reveal[0] + c.i * stagger, reveal[1]] : null }));
  const normArrows = (reveal = null) => CAMS.forEach(c => {
    b.dot(c.pp, c.color, 0.7, { name: `${c.unit} 주점`, extra: '광축이 이미지 평면과 만나는 자리 · 정규화 좌표의 원점' });
    b.arrow(c.pp, Fg.O[c.i][FEAT].pt, c.color, { head: 2.2, reveal: reveal ? [reveal[0] + c.i * 0.4, reveal[1]] : null });
  });

  /* 삼각측량으로 낸 관절 33개와 뼈 */
  const skel3d = () => {
    const dots = Fg.T.map((T, j) => b.dot(T, '--joint', j === FEAT ? 1.9 : 1.3, jointInfo(j)));
    const sg = b.lines(pairsOf(Fg.T, BONES), '--joint', { r: 0.4 });
    Fg.on(() => { dots.forEach((d, j) => setPos(d, Fg.T[j])); sg.update(vpairs(Fg.T, BONES)); });
  };
  const worldTriad = (o = {}) => b.triad([0, 0.5, 0], [[1, 0, 0], [0, 1, 0], [0, 0, 1]], 34, ['x', 'y', 'z'], { cls: '', ...o });
  const rackTriad = (o = {}) => b.triad(RACK_O, [EX, EY, EZ], 40, ['x<sub>r</sub>', 'y<sub>r</sub>', 'z<sub>r</sub>'], { cls: '', ...o });
  const rv = (on, a, d) => on ? [a, d] : null;

  /* 지표 그림: 골반 높이(연직 점선) · 무릎 각도(호) · 몸통 기울기(어깨-골반 선과 연직). 반복 비트에서는 자세를 따라 움직인다 */
  const metricVisuals = on => {
    const hipF = () => r2f(Fg.M.hipMid), shF = () => r2f(Fg.M.shMid), foot = p => [p[0], 0, p[2]], upOf = p => add(p, [0, LEN.trunk, 0]);
    const arcPts = () => { const T = Fg.T, k = T[25], u1 = unit(sub(T[27], k)), u2 = unit(sub(T[23], k)), W = Math.acos(Math.max(-1, Math.min(1, dot3(u1, u2)))), n = 10, pts = []; for (let i = 0; i <= n; i++) { const s = i / n; pts.push(add(k, mul(add(mul(u1, Math.sin((1 - s) * W)), mul(u2, Math.sin(s * W))), 9 / Math.sin(W)))); } return pts; };
    const arcPairs = pts => pts.slice(1).map((p, i) => [pts[i], p]);
    const hipTxt = () => `골반 높이 ${fmt(Fg.M.hipH, 0)} cm`, kneeTxt = () => `무릎 각도 ${fmt(Fg.M.kneeL, 0)}°`, trunkTxt = () => `몸통 기울기 ${fmt(Fg.M.trunk, 0)}°`;
    const h0 = hipF(), s0 = shF(), a0 = arcPts();
    const plumb = b.lines([[h0, foot(h0)]], '--metric', { dashed: true, r: 0.32, opacity: 0.9, reveal: rv(on, 0.2, 0.8) });
    const hipL = b.label(hipTxt(), midOf(h0, foot(h0)), { color: css('--metric'), reveal: rv(on, 1.0, 0.4), id: 'hipH' });
    const arc = b.lines(arcPairs(a0), '--metric', { r: 0.35, reveal: rv(on, 1.4, 0.6) });
    const kneeL = b.label(kneeTxt(), a0[5], { color: css('--metric'), reveal: rv(on, 2.0, 0.4), id: 'knee' });
    const trunkLn = b.lines([[h0, s0]], '--metric', { r: 0.5, reveal: rv(on, 2.4, 0.5) });
    const vert = b.lines([[h0, upOf(h0)]], '--metric', { dashed: true, r: 0.3, opacity: 0.8, reveal: rv(on, 2.6, 0.5) });
    const trunkL = b.label(trunkTxt(), lerp3(h0, upOf(h0), 0.8), { color: css('--metric'), reveal: rv(on, 3.1, 0.4), id: 'trunk' });
    Fg.on(() => {
      const h = hipF(), s = shF(), pts = arcPts();
      plumb.update([[V3(h), V3(foot(h))]]); hipL.pos.copy(V3(midOf(h, foot(h)))); setText('hipH', hipTxt());
      arc.update(arcPairs(pts).map(([p, q]) => [V3(p), V3(q)])); kneeL.pos.copy(V3(pts[5])); setText('knee', kneeTxt());
      trunkLn.update([[V3(h), V3(s)]]); vert.update([[V3(h), V3(upOf(h))]]); trunkL.pos.copy(V3(lerp3(h, upOf(h), 0.8))); setText('trunk', trunkTxt());
    });
  };
  /* 하중 그림(#649 다리별): 바 · 무게중심(몸+바)과 연직선 · 두 발이 받는 몫과 바닥 힘 · 발 중점에서의 전후 쏠림 ·
     다리마다 무릎과 골반에서 그 발이 받는 힘의 선까지의 모멘트 팔(앞뒤·안팎) */
  const loadVisuals = on => {

  const byStage = {};
  BEATS.forEach((bt, i) => { (byStage[bt.stage] ||= []).push(i); });
  Object.entries(byStage).forEach(([st, idx]) => {
    const g = document.createElement('div'); g.className = 'st'; g.style.setProperty('--w', idx.reduce((s, i) => s + BEATS[i].dur, 0).toFixed(2));
    idx.forEach(i => {
      const sg = document.createElement('button'); sg.type = 'button'; sg.className = 'sg'; sg.dataset.i = i; sg.style.setProperty('--d', BEATS[i].dur.toFixed(2));
      sg.setAttribute('aria-label', `${st} ${STAGE_NAME[st]} ${BEATS[i].name}`);
      const f = document.createElement('i'); sg.appendChild(f); g.appendChild(sg); segs.push({ sg, f });
    });
    bar.appendChild(g);
  });
  bar.addEventListener('click', e => { const sg = e.target.closest('.sg'); if (sg) goto(+sg.dataset.i); });
}

function renderControls() {
  const bt = beat(), atEnd = state.i === BEATS.length - 1 && state.t >= bt.dur && !state.playing;
  $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(+x.dataset.stage === bt.stage)));
  $('#meta-stage').textContent = `${bt.stage} ${STAGE_NAME[bt.stage]} · ${bt.name}`;
  const fc = $('#meta-file'); fc.hidden = !bt.file; fc.textContent = bt.file || '';
  if (VIDEO) $('#cap').innerHTML = bt.cap.split(/(?<=다\.)\s+/).map(s => s.replace(/[<>&]/g, '')).join('<br>');
  else $('#cap').textContent = bt.cap;
  const pb = $('#play'); pb.textContent = state.playing ? '일시정지' : atEnd ? '처음부터' : '재생'; pb.setAttribute('aria-pressed', String(state.playing));
  $('#prev').disabled = state.i === 0; $('#next').disabled = state.i === BEATS.length - 1;
  segs.forEach((s, i) => s.sg.setAttribute('aria-current', String(i === state.i)));
}
function renderProgress() {
  const bt = beat();
  segs.forEach((s, i) => { s.f.style.width = i < state.i ? '100%' : i === state.i ? (clamp01(state.t / bt.dur) * 100).toFixed(1) + '%' : '0'; });
}
function goto(i, { play = true, fresh = false } = {}) {
  if (!viewer) return;
  state.i = Math.max(0, Math.min(BEATS.length - 1, i)); state.t = RM ? beat().dur : 0; hold = 0;
  const bt = beat();
  viewer.setScene(buildScene(bt));
  if (state.view === 'free' && (bt.stage !== lastStage || bt.view)) {
    const v = bt.view || STAGE_VIEW[bt.stage];
    viewer.tweenView(v[0], v[1], lastStage === 0 || RM || fresh ? 0 : 1.1, RENDER ? 0 : performance.now());
  }
  lastStage = bt.stage;
  state.playing = RENDER ? false : play;
  render(state.t, RENDER ? 0 : performance.now());
  renderControls(); renderProgress(); if (!RENDER) ensureLoop();
}
function ensureLoop() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
function loop(now) {
  raf = 0;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const bt = beat();
  if (state.playing) {
    if (RM) { hold += dt; if (hold >= Math.min(bt.dur, 3)) { if (state.i < BEATS.length - 1) { goto(state.i + 1); return; } if (EMBED) { goto(0); return; } state.playing = false; renderControls(); } }
    else { state.t += dt; if (state.t >= bt.dur) { if (state.i < BEATS.length - 1) { goto(state.i + 1); return; } if (EMBED) { goto(0); return; } state.t = bt.dur; state.playing = false; renderControls(); } }
  }
  render(state.t, now);
  renderProgress();
  if (state.playing || viewer.busy()) raf = requestAnimationFrame(loop);
}
function togglePlay() {
  const bt = beat();
  if (state.playing) { state.playing = false; renderControls(); return; }
  if (state.i === BEATS.length - 1 && state.t >= bt.dur) { goto(0); return; }
  if (state.t >= bt.dur) { goto(state.i + 1); return; }
  state.playing = true; renderControls(); ensureLoop();
}
$('#play').addEventListener('click', togglePlay);
$('#prev').addEventListener('click', () => goto(state.i - 1));
$('#next').addEventListener('click', () => goto(state.i + 1));
$('#tabs').addEventListener('click', e => {
  const bt = e.target.closest('button[data-stage]'); if (!bt) return;
  const st = +bt.dataset.stage;
  goto(BEATS.findIndex(x => x.stage === st));
  try { history.replaceState(null, '', '#s' + st); } catch (_) { /* 주소 바꾸기 막힘 */ }
});
$('#views').addEventListener('click', e => {
  const bt = e.target.closest('button[data-view]'); if (!bt) return;
  state.view = bt.dataset.view;
  $('#views').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === bt)));
  if (!viewer) return;
  if (state.view === 'free') { const v = beat().view || STAGE_VIEW[beat().stage]; viewer.setView('free'); viewer.tweenView(v[0], v[1], 0); }
  else viewer.setView(state.view);
  render(state.t, performance.now());
});
document.addEventListener('keydown', e => {
  if (e.target.closest('button')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') goto(state.i + 1);
  else if (e.key === 'ArrowLeft') goto(state.i - 1);
});
new ResizeObserver(() => { if (viewer) render(state.t, performance.now()); }).observe(insetEl);
const stageFromHash = () => (/^#s[1-4]$/.test(location.hash) ? +location.hash[2] : 0);
addEventListener('hashchange', () => { const st = stageFromHash(); if (st) goto(BEATS.findIndex(x => x.stage === st)); });
if (RENDER) {
  window.__beats = BEATS.map(x => ({ stage: x.stage, dur: x.dur, name: x.name }));
  window.__seek = (i, t, fresh = false) => { if (i !== state.i || fresh) goto(i, { fresh }); state.t = t; render(t, t * 1000); renderProgress(); };
  goto(0, { fresh: true });
  document.fonts.ready.then(() => { window.__ready = true; });
} else {
  const st = stageFromHash();
  goto(st ? BEATS.findIndex(x => x.stage === st) : 0, { play: !RM });
  /* 끼워 넣는 쪽(viewer-tabs.js)이 탭 뒤에 숨기거나 화면 밖으로 나갈 때 멈추라고 알린다 */
  let held = false;
  addEventListener('message', e => {
    const m = e.data; if (!m || !m.hw) return;
    if (m.hw === 'pause') { held = true; if (state.playing) { state.playing = false; renderControls(); } }
    else if (m.hw === 'resume') { held = false; if (!state.playing && !RM) { state.playing = true; renderControls(); ensureLoop(); } }
  });
  /* 끼워 넣기: 화면 밖으로 나가면 멈추고, 돌아오면 이어서 돈다(한 페이지에 애니메이션 다섯이 같이 돌지 않게) */
  if (EMBED && 'IntersectionObserver' in window && !RM) {
    let seen = true;
    new IntersectionObserver(es => {
      const on = es.some(e => e.isIntersecting);
      if (on === seen) return; seen = on;
      if (on) { if (!held && !state.playing) { state.playing = true; renderControls(); ensureLoop(); } }
      else if (state.playing) { state.playing = false; renderControls(); }
    }, { threshold: 0.05 }).observe(document.body);
  }
}
</script>

</body></html>
