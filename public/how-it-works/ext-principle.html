<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>위치 보정 산출 원리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 3D 뷰(격벽 뷰어)가 화면 전체. 단계 탭과 시점 버튼은 위에, 재생기(자막·진행 막대·버튼)는 아래 가운데에 떠 있다.
   색은 리그 키오스크 리포트 화면의 격벽 뷰어를 따른다. 밝은 테마 하나로 고정한다(원본 "위치 보정 3단계" 와 같은 선택) */
:root{
  --bg:#e9edf2; --panel:#ffffff; --pane:#f2f5f8; --grid:#c9d2db; --edge:#aeb9c4;
  --fg:#1b1f27; --muted:#5b6270; --line:#d5dce4; --accent:#1f5fb0;
  --ok:#1f8a5b; --free:#b7791f; --est:#2E7DD1; --rack:#6b7480; --rack-fill:#cdd3da; --anchor:#c99400; --spike:#1b1f27;
  --c1:#D9483B; --c2:#2E7DD1; --c3:#2FA36B;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;padding:0;background:var(--panel);color:var(--fg);font:14px/1.5 var(--font);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{position:fixed;inset:0}
.v3d{position:absolute;inset:0;background:var(--panel);overflow:hidden;touch-action:none}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov .tick{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 10.5px/1 var(--mono);color:var(--muted);will-change:transform}
.ov .ttl{font-weight:700;color:var(--fg)}
.ov .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 11px/1.2 var(--mono);padding:2px 4px;color:var(--fg);will-change:transform,opacity}
.ov .lbl.k{font-weight:500;color:var(--muted)}
.ov .lead{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ov .lead line{stroke-width:1.2;opacity:.8}
.ov .lead circle{opacity:.9}
.ov .tip{position:absolute;left:0;top:0;display:none;z-index:3;padding:6px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 11px/1.45 var(--mono);white-space:nowrap}
.ov .tip div+div{color:var(--muted);font-weight:500}

/* 위: 단계 탭(왼쪽) · 시점(오른쪽). 좁으면 두 줄로 */
.top{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top,0px));left:0;right:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);font-weight:500;font-size:13px;display:flex;gap:7px;align-items:center}
.tabs button b{font:600 11px/1 var(--mono);color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs button[aria-selected="true"] b{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.seg button{padding:6px 11px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[disabled]{opacity:.45;cursor:default}

/* 아래: 재생기 */
.player{position:absolute;z-index:5;left:0;right:0;bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none}
.card{pointer-events:auto;width:min(760px,100%);min-width:0;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px 12px;display:grid;gap:8px;box-shadow:0 2px 12px rgba(27,31,39,.10)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:600 11px/1 var(--mono);color:var(--muted)}
.meta .file{padding:3px 6px;border-radius:4px;background:var(--pane);color:var(--fg);font-weight:500}
.meta .hint{margin-left:auto;font-weight:500}
.cap{font-size:14px;line-height:1.5;min-height:3em;text-wrap:pretty;max-width:62ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.ctl button{padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.ctl button:last-child{border-right:0}
.ctl button[disabled]{opacity:.4;cursor:default}
.ctl .play{min-width:78px;font-weight:600;background:var(--accent);color:#fff}
.bar{flex:1;min-width:180px;display:flex;gap:7px;height:14px;align-items:stretch}
.bar .st{display:flex;gap:2px;flex:var(--w) 1 0;min-width:0}
.bar .sg{flex:var(--d) 1 0;min-width:4px;padding:0;background:var(--line);border-radius:2px;position:relative;overflow:hidden;display:block}
.bar .sg i{position:absolute;inset:0;width:0;background:var(--accent);display:block}
.bar .sg[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:560px){ .meta .hint{display:none} .cap{min-height:4.5em} }
/* 영상 저장용(?video=1): 단계 탭·시점·진행 막대·버튼·안내를 다 숨기고 자막 카드만 남긴다. 글자는 태블릿 화면에 맞게 키운다 */
body.video .top,body.video .row,body.video .hint{display:none}
body.video .v3d{bottom:124px}                       /* 3D 는 자막 띠 위까지만 — 바닥 눈금이 자막과 겹치지 않게 */
body.video .card{background:none;border:0;box-shadow:none;width:min(1100px,100%);padding:0 0 14px;gap:8px;justify-items:center;text-align:center}
body.video .meta{font-size:13px;justify-content:center}
body.video .meta .file{background:none;padding:0;color:var(--muted)}
body.video .cap{font-size:20px;line-height:1.55;min-height:0;max-width:none;text-align:center;text-wrap:balance}
/* 사이트 끼워 넣기용(?embed=1&bg=eceef1): 탭·시점·단계 이름·버튼·안내를 숨기고, 얇은 진행 막대 하나와 상자 없는 자막만 남긴다.
   바탕은 ?bg= 로 받아 섹션과 같은 색으로 그린다. 끝나면 처음부터 다시 돌고, 화면 밖에 있는 동안은 멈춘다 */
body.embed{background:var(--bg)}
body.embed .v3d{background:transparent;bottom:92px}
body.embed .top,body.embed .meta,body.embed .ctl{display:none}
body.embed .player{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
body.embed .card{background:none;border:0;box-shadow:none;width:min(820px,100%);padding:0;gap:10px;justify-items:center;text-align:center}
body.embed .cap{display:grid;align-content:end;font-size:1.125rem;word-break:keep-all;line-height:1.5;min-height:3em;max-width:none;text-align:center;text-wrap:balance}
body.embed .row{width:100%}
body.embed .bar{gap:0;height:3px;min-width:0;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--fg) 12%,transparent)}
body.embed .bar .st{gap:0}
body.embed .bar .sg{min-width:0;border-radius:0;background:transparent}
body.embed .bar .sg[aria-current="true"]{box-shadow:none}
@media (max-width:560px){ body.embed .v3d{bottom:112px} body.embed .cap{min-height:4.5em} }
.err{display:flex;align-items:center;justify-content:center;height:100%;font:600 12px/1.4 var(--mono);color:var(--muted);padding:16px;text-align:center}
</style>

<script type="module">
let THREE;
try { THREE = await import('/vendor/three/three.module.min.js'); }
catch (_) { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'); }

/* ═══════════════════ 굵은 선 ═══════════════════
   WebGL 의 선은 늘 1 장치 픽셀이라 고해상도 화면·캡처에서 머리카락처럼 가늘어진다. 선분 하나를 가는 원기둥 하나로 그리고
   한 묶음을 InstancedMesh 하나에 담는다(굵기 r 은 cm — 가까운 선이 조금 더 굵게 보이는 원근은 그대로 둔다). 점선은 대시마다 원기둥 하나 */
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true); UNIT_CYL.userData.keep = true;   // 공유 — 장면을 버릴 때 dispose 하지 않는다
const UP_Y = new THREE.Vector3(0, 1, 0);
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _d = new THREE.Vector3();
class Segs {
  constructor(parent, color, { opacity = 1, r = 0.4, dashed = false, dash = 3.5, gap = 2.2 } = {}) {
    this.r = r; this.dashed = dashed; this.dash = dash; this.gap = gap; this.cap = 0; this.mesh = null;
    this.mat = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity });
    this.g = new THREE.Group(); parent.add(this.g);
  }
  ensure(n) {
    if (this.mesh && n <= this.cap) return;
    if (this.mesh) { this.g.remove(this.mesh); this.mesh.dispose(); }
    this.cap = Math.max(8, Math.ceil(n * 1.25));
    this.mesh = new THREE.InstancedMesh(UNIT_CYL, this.mat, this.cap); this.mesh.frustumCulled = false; this.g.add(this.mesh);
  }
  update(pairs) {                                  // pairs: [[Vector3, Vector3], …]  부모 좌표계
    const segs = [];
    for (const [a, b] of pairs) {
      if (!this.dashed) { segs.push(a, b); continue; }
      _d.subVectors(b, a); const L = _d.length(); if (L < 1e-6) continue; _d.divideScalar(L);
      for (let s = 0; s < L; s += this.dash + this.gap) { const e = Math.min(L, s + this.dash); segs.push(a.clone().addScaledVector(_d, s), a.clone().addScaledVector(_d, e)); }
    }
    const n = segs.length / 2; this.ensure(n);
    for (let i = 0; i < n; i++) {
      const a = segs[2 * i], b = segs[2 * i + 1];
      _d.subVectors(b, a); const L = _d.length();
      if (L < 1e-6) { _s.set(0, 0, 0); _q.identity(); } else { _d.divideScalar(L); _q.setFromUnitVectors(UP_Y, _d); _s.set(this.r, L, this.r); }
      _p.addVectors(a, b).multiplyScalar(0.5); _m4.compose(_p, _q, _s); this.mesh.setMatrixAt(i, _m4);
    }

    return this;
  }
}
const toPairs = flat => { const o = []; for (let i = 0; i + 1 < flat.length; i += 2) o.push([flat[i], flat[i + 1]]); return o; };
/* 장면을 버릴 때: 공유 기하는 남기고 InstancedMesh 는 제 버퍼를 지운다 */
const disposeTree = root => root.traverse(o => { if (o.isInstancedMesh) o.dispose(); if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose(); if (o.material) o.material.dispose(); });

/* ═══════════════════ 데이터 (원본 "위치 보정 3단계" 와 같다) ═══════════════════
   카메라 K·R·t: 2026-08-28 PVC 리그 회차의 calibration_floor.json (당시 규약 y 아래). 읽으면서 y 위로 바꾼다.
   기준 카메라는 C3. 랙 자세·랙 앵커 잔차는 예시값, 랙 치수만 프리셋 pvc_prototype 실측. 단위 cm. */
const RAW = {
  cams: [
    { unit: 'C1', ref: false, color: '#D9483B', res: [1920, 1200], K: [[754.3885, 0, 958.3901], [0, 754.0707, 589.3091], [0, 0, 1]],
      R: [[-0.15571322513590607, 0.9097554007454354, -0.38483568224930287], [0.8648641536539832, -0.06266303658242406, -0.4980796518335677], [-0.47724562569200496, -0.41038817558597096, -0.7770573711747831]],
      t: [51.590955807405955, -39.45737480615681, 54.95397136017899] },
    { unit: 'C2', ref: false, color: '#2E7DD1', res: [1920, 1200], K: [[753.0304, 0, 913.8973], [0, 753.1349, 606.1174], [0, 0, 1]],
      R: [[-0.225324469469351, -0.9297371771486811, 0.29123472472553313], [-0.8913797239970729, 0.07606163234231916, -0.4468297390867395], [0.39328243172719657, -0.3602824024470577, -0.8458874153111148]],
      t: [-39.82676917611968, -9.86989754651869, 42.398635742616285] },
    { unit: 'C3', ref: true,  color: '#2FA36B', res: [1920, 1200], K: [[751.4181, 0, 979.4653], [0, 751.3425, 602.4515], [0, 0, 1]],
      R: [[0.20999218404048606, -0.7846917494500244, -0.5832342076618673], [-0.8915870591669028, 0.09110655694011054, -0.44359002604728537], [0.4012178941273924, 0.6131545104030289, -0.6804893443724163]],
      t: [-133.78484504711085, 2.2732873447759743, 145.3864252187952] },
  ],
  anchorQuad: [[0, 0, 0], [36, 0, 0], [36, 0, -54], [0, 0, -54]],
  pair: { rotDeg: 0.182, tCm: 0.35 },

const BOARD = { W: 36, H: 54, T: 0.3 };
const RACK = { label: 'PVC 프로토타입', W: 118, D: 106, H: 241, u: 7.6, Wi: 109, Di: 95.8, storage: 38.4, B: 4, margin: 2,
  cs: 7.6, holePitch: 5, holeFirst: 6.8, holeLast: 240, jcupW: 11, jcupH: 12, jcupReach: 15, jcupNose: 3.5, jcupHeight: 130, safetyW: 7.6, safetyT: 10.2, safetyHeight: 60 };
const RACK_POSE = { c: [17.0, 0, 45.0], yaw: -1.1 };
const RACK_Q = { resid: 0.64, yawCross: 0.435, residMax: 2.0, yawMax: 1.0 };
const VOL = { lat: [-120, 120, 3], dep: [-70, 70, 3], hgt: [0, 180, 2] };
const N_CELLS = 18;

/* ── 작은 선형대수 ── */
const F = [[1, 0, 0], [0, -1, 0], [0, 0, -1]];
const mm = (A, B) => A.map(r => B[0].map((_, j) => r.reduce((s, a, k) => s + a * B[k][j], 0)));
const mv = (A, v) => A.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
const tr = A => A[0].map((_, j) => A.map(r => r[j]));
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const nrm = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => mul(a, 1 / (nrm(a) || 1));
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const lin = ([lo, hi, n]) => Array.from({ length: n + 1 }, (_, i) => lo + (hi - lo) * i / n);
const fmt = (v, n = 1) => { const s = (Math.round(Math.abs(v) * 10 ** n) / 10 ** n).toFixed(n); return (v < 0 && s !== (0).toFixed(n) ? '−' : '') + s; };
const vec = (p, n = 1) => `(${fmt(p[0], n)}, ${fmt(p[1], n)}, ${fmt(p[2], n)})`;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = k => 1 - (1 - k) ** 3;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
const prog = (t, r) => clamp01((t - r[0]) / Math.max(r[1], 1e-3));

/* ── 카메라: y 위로 바꾸고 중심·축·시야 피라미드(28cm) ── */
const CAMS = RAW.cams.map(c => {
  const Rn = mm(c.R, F), Rt = tr(Rn);
  const C = mul(mv(Rt, c.t), -1);
  const [W, H] = c.res, fx = c.K[0][0], fy = c.K[1][1], cx = c.K[0][2], cy = c.K[1][2], d = 28;
  const corners = [[0, 0], [W, 0], [W, H], [0, H]].map(([u, v]) => mv(Rt, sub([(u - cx) / fx * d, (v - cy) / fy * d, d], c.t)));
  return { ...c, Rn, C, axes: [Rn[0], Rn[1], Rn[2]], corners };
});
const REF = CAMS.find(c => c.ref), OTH = CAMS.filter(c => !c.ref);
const ANCHOR = RAW.anchorQuad.map(q => [q[0], -q[1] + BOARD.T, -q[2]]);
const ANCHOR_C = [18, 0, 27];

/* ── 랙 좌표계 ── */
const yaw = RACK_POSE.yaw * Math.PI / 180;
const EX = [Math.cos(yaw), 0, Math.sin(yaw)], EY = [0, 1, 0], EZ = [-Math.sin(yaw), 0, Math.cos(yaw)];

const TEX = (() => {
  const c = document.createElement('canvas'); c.width = 4 * 32; c.height = 6 * 32; const g = c.getContext('2d');
  g.fillStyle = '#f4f1e8'; g.fillRect(0, 0, c.width, c.height);
  for (let j = 0; j < 6; j++) for (let i = 0; i < 4; i++) {
    if ((i + j) % 2 === 0) { g.fillStyle = '#232629'; g.fillRect(i * 32, j * 32, 32, 32); }
    else { g.fillStyle = '#232629'; g.fillRect(i * 32 + 8, j * 32 + 8, 16, 16); g.fillStyle = '#f4f1e8'; g.fillRect(i * 32 + 12, j * 32 + 12, 4, 4); g.fillRect(i * 32 + 16, j * 32 + 16, 4, 4); }

})();

/* 빌더. 모든 도형은 cur(기본 G)에 들어간다. grouped() 로 묶으면 묶음째 fade 할 수 있다.
   reveal = [시작 초, 길이 초]. 화살표·광선은 자라고(draw-on), 나머지는 투명도로 나타난다. 없으면 처음부터 놓여 있다 */
function sceneBuilder() {
  const G = new THREE.Group(), labels = [], pickables = [], anims = [], bb = new THREE.Box3();

  const UP = new THREE.Vector3(0, 1, 0);

    G, labels, pickables, anims, bb,
    anim(fn) { anims.push(fn); },
    grouped(fn, reveal = null, out = false) {
      const g = new THREE.Group(), prev = cur, prevR = defReveal;

    fade(obj, reveal, { out = false } = {}) {

    label(text, pos, o = {}) { labels.push({ text, pos: V(pos), cls: o.cls, color: o.color, pin: !!o.pin, reveal: o.reveal === undefined ? defReveal : o.reveal }); },
    /* 선 묶음. reveal 이 있으면 시작점에서 끝점으로 자란다(draw-on). 굵기 r 은 cm */
    lines(pairs, color, { dashed = false, opacity = 1, reveal = null, r = 0.4 } = {}) {

    },
    /* 화살표: aim(시작, 끝) 으로 겨누고 set(길이 비율, 투명도) 으로 자란다 */

      /* 자루: 굵은 화살표는 원기둥 하나, 가는 화살표는 더 가는 원기둥, 점선 화살표는 대시 원기둥 묶음 */

      g.add(cone);
      const A = new THREE.Vector3(), Bv = new THREE.Vector3(), dir = new THREE.Vector3(), end = new THREE.Vector3();
      let len = 0, h = 0, w = 0, frac = 1, opa = opacity, grown = false;
      const api = {
        g,
        aim(p, q) {

          h = head ?? Math.min(len * 0.28, thick ? 10 : 7); w = thick ? h * 0.5 : h * 0.42;

        },
        set(f, o = opa) {
          frac = f; opa = o; const L = len * f;
          g.visible = L > 0.3 && o > 0.005; if (!g.visible) return;
          const hh = Math.min(h, L), sl = Math.max(0, L - hh);
          end.copy(A).addScaledVector(dir, sl);
          if (segs) { segs.update([[A, end]]); segs.mat.opacity = o; segs.mat.transparent = true; }
          else { shaft.scale.set(1, Math.max(sl, 0.01), 1); shaft.position.copy(A).addScaledVector(dir, sl / 2); shaft.quaternion.setFromUnitVectors(UP, dir); shaft.material.opacity = o; }

    arrow(a, c, color, o = {}) {

    },
    dot(p, color, r = 2.6, info = null, { reveal = null } = {}) {

    },
    quad(q, color, { opacity = 0.3, dashed = false, info = null, nogrow = false, reveal = null } = {}) {

      g.add(mesh);
      new Segs(g, C, { r: 0.35, dashed }).update(P.map((p, i) => [p, P[(i + 1) % 4]]));   // 테두리
      if (info) { const center = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(0.25); mesh.userData = { ...info, center, color: typeof color === 'string' && !color.startsWith('--') ? color : css(color) }; pickables.push(mesh); }

    board(q, { opacity = 1, info = null, ghost = false, reveal = null } = {}) {

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(q.flat(), 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));

      cur.add(mesh); q.forEach(grow);

    },
    /* 움직이는 보드·광선 (3 단계 모으기) */
    boardDyn(q, { opacity = 0.5 } = {}) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(q.flat(), 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      geo.setIndex([0, 1, 2, 0, 2, 3]);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: TEX, side: THREE.DoubleSide, transparent: true, opacity }));

    raysDyn(c, q, { opacity = 0.4 } = {}) {

    triad(o, axes, len, names, { color = null, cls = 'k', reveal = null } = {}) {

      const lr = reveal ? [reveal[0] + reveal[1] * 0.7, reveal[1] * 0.4] : undefined;
      axes.forEach((ax, i) => { const e = add(o, mul(unit(ax), len)); b.arrow(o, e, cols[i], { head: Math.min(5, len * 0.3), nogrow: true, reveal }); b.label(names[i], add(o, mul(unit(ax), len * 1.18)), { cls, color: cols[i], pin: true, reveal: lr }); });
    },
    camera(c, { ghost = false, label = true, reveal = null, out = false } = {}) {
      return b.grouped(() => {
        const pairs = c.corners.map(k => [c.C, k]).concat(c.corners.map((k, i) => [k, c.corners[(i + 1) % 4]]));
        b.lines(pairs, c.color, { dashed: ghost, opacity: ghost ? 0.45 : 1 });
        const m = b.dot(c.C, c.color, 2.6, { name: c.ref ? '기준 카메라 ' + c.unit : c.unit, extra: ghost ? '위치 어림 전' : `바닥 좌표 ${vec(c.C)} cm` });
        if (ghost) { m.material.transparent = true; m.material.opacity = 0.5; }

    },
    box(lo, hi, map, color, { dashed = false, opacity = 1, reveal = null } = {}) {

    rack({ faint = false, origin = true, reveal = null } = {}) {

        [-1, 1].forEach(sx => { bx(U, H, U, [sx * cw, H / 2, szc]); bx(CS, CS, gap, [sx * cw, CS / 2, -(cd + U / 2) - gap / 2]); bx(CS, CS, gap, [sx * cw, H - CS / 2, -(cd + U / 2) - gap / 2]); });

        b.lines(inner.map((p, i) => [p, inner[(i + 1) % 4]]), faint ? '--grid' : '--rack', { dashed: true, opacity: faint ? 0.6 : 0.9 });

      }, reveal);
    },

}

/* 비트별 장면. 같은 단계의 앞 비트에서 산출된 것은 다 놓인 채로 두고, 이 비트에서 산출되는 것만 reveal 을 단다 */
function buildScene(bt) {
  const b = sceneBuilder(), S = bt.stage, K = bt.key;
  const anchorInfo = { name: '앵커 보드', extra: '첫 모서리 = 바닥 원점 · 패턴면 = y 0' };
  const worldTriad = (o = {}) => b.triad([0, BOARD.T + 0.5, 0], [[1, 0, 0], [0, 1, 0], [0, 0, 1]], 34, ['x', 'y', 'z'], { cls: '', ...o });
  const camTriad = (c, len = 16, o = {}) => b.triad(c.C, c.axes, len, ['x<sub>c</sub>', 'y<sub>c</sub>', 'z<sub>c</sub>'], o);
  const rackTriad = (o = {}) => b.triad(RACK_O, [EX, EY, EZ], 40, ['x<sub>r</sub>', 'y<sub>r</sub>', 'z<sub>r</sub>'], { cls: '', ...o });
  const midOf = (a, c) => mul(add(a, c), 0.5);

  if (S === 1) {
    /* 먼저 있던 것: 앵커 보드(= 바닥 좌표계) · 기준 카메라 */
    b.board(ANCHOR, { opacity: 0.5, info: anchorInfo });
    b.label('앵커 보드', ANCHOR_C, { color: css('--anchor'), cls: 'k' });
    b.label('바닥 원점', [0, 0.6, 0], { color: css('--anchor') });
    worldTriad();
    b.camera(REF);
    const rays = ANCHOR.map(q => [REF.C, q]);
    if (K === 'see') b.lines(rays, REF.color, { opacity: 0.55, reveal: [0.4, 1.0] });
    else {
      b.lines(rays, REF.color, { opacity: 0.55 });
      /* 산출: 벡터가 자란 뒤 그 끝에서 카메라 좌표축 · 높이 */
      b.arrow([0, 0, 0], REF.C, '--anchor', { thick: true, reveal: [0, 1.4] });
      b.label('기준 카메라 벡터', mul(REF.C, 0.55), { color: css('--anchor'), reveal: [1.3, 0.4] });
      camTriad(REF, 16, { reveal: [1.5, 0.8] });
      b.lines([[[REF.C[0], 0, REF.C[2]], REF.C]], '--ok', { dashed: true, reveal: [2.5, 0.7] });
      b.label('카메라 높이', [REF.C[0], REF.C[1] / 2, REF.C[2]], { color: css('--ok'), reveal: [3.1, 0.4] });
    }
  }

  if (S === 2) {
    /* 먼저 있던 것: 1 단계 결과(바닥 원점·축, 기준 카메라 자세) · 랙 · 코너 보드 둘 */
    b.board(ANCHOR, { ghost: true, info: anchorInfo });
    b.label('바닥 원점', [0, 0.6, 0], { color: css('--anchor'), cls: 'k' });
    worldTriad();
    b.camera(REF); camTriad(REF);
    b.rack();
    const boards = {};
    Object.entries(cornerBoards).forEach(([slot, cb]) => {
      const q = cb.quad.map(r2f), cornerF = r2f(cb.corner);
      boards[slot] = { q, cornerF };
      b.board(q, { opacity: 0.5, info: { name: `랙 코너 · ${slot}`, extra: `${cb.role} · 스페이서 B ${B}cm + 여백 ${M}cm 안쪽` } });
      const sx = Math.sign(cb.corner[0]), sz = Math.sign(cb.corner[2]);
      b.box([cb.corner[0] - sx * B, 0, cb.corner[2] - sz * 60], [cb.corner[0], 4, cb.corner[2]], r2f, '--rack', { opacity: 0.8 });
      b.box([cb.corner[0] - sx * 60, 0, cb.corner[2] - sz * B], [cb.corner[0], 4, cb.corner[2]], r2f, '--rack', { opacity: 0.8 });
      b.dot(cornerF, cb.role === '앵커' ? '--ok' : '--est', 2.2, { name: `관측점 · ${slot}`, extra: cb.role === '앵커' ? '원점 x·z 와 yaw 를 정하는 코너' : `검산 코너 · 잔차 ${fmt(RACK_Q.resid)} cm` });
      b.label(cb.role === '앵커' ? '앵커 코너' : '검산 코너', cornerF, { color: css(cb.role === '앵커' ? '--ok' : '--est'), cls: 'k' });
    });
    const raysA = boards.front_left.q.map(p => [REF.C, p]), raysC = boards.front_right.q.map(p => [REF.C, p]);
    if (K === 'see') b.lines(raysA, REF.color, { opacity: 0.4, reveal: [0.5, 1.0] });
    else {
      b.lines(raysA, REF.color, { opacity: 0.4 });
      const now = K === 'solve';
      /* 산출: 바닥 원점에서 랙 원점으로 벡터가 자란 뒤 랙 좌표축 */
      b.arrow([0, 0.6, 0], [RACK_O[0], 0.6, RACK_O[2]], '--rack', { thick: true, reveal: now ? [0, 1.4] : null });
      b.label('랙 원점', RACK_O, { color: css('--rack'), reveal: now ? [1.3, 0.4] : null });
      rackTriad({ reveal: now ? [1.5, 0.8] : null });
      if (K === 'check') {
        b.lines(raysC, REF.color, { opacity: 0.4, reveal: [0.3, 1.0] });
        b.dot(boards.front_right.cornerF, '--est', 4.5, null, { reveal: [1.3, 0.5] }).material.opacity = 0.3;
        b.label(`차이 ${fmt(RACK_Q.resid, 2)}cm`, boards.front_right.cornerF, { color: css('--est'), reveal: [1.4, 0.4] });
      }
    }
  }

  if (S === 3) {
    /* 먼저 있던 것: 바닥 좌표계 · 기준 카메라 자세 · 랙(흐리게) · 나머지 두 대(위치 모름 = 점선) */
    b.board(ANCHOR, { ghost: true, info: anchorInfo });
    worldTriad();
    b.rack({ faint: true, origin: false });
    b.camera(REF); camTriad(REF);
    const solved = K === 'solve';
    if (K === 'gather' || solved) CELLS.forEach(c => b.box(c.lo, c.hi, null, '--grid', { dashed: true, opacity: 0.85 }));
    if (!solved) OTH.forEach(c => b.camera(c, { ghost: true }));
    const p0 = POSES[SAMPLE0];
    const boardInfo = { name: '표본', extra: '세 대가 같이 본 보드 한 장 = 표본 하나' };
    if (K === 'see' || K === 'sample') {
      b.board(p0.quad, { opacity: 0.5, info: boardInfo });
      const bo = p0.quad[0], bu = unit(sub(p0.quad[1], bo)), bv = unit(sub(p0.quad[3], bo));
      b.triad(bo, [bu, bv, p0.normal], 12, ['x<sub>b</sub>', 'y<sub>b</sub>', 'z<sub>b</sub>']);
      b.dot(bo, p0.color, 1.6, { name: '보드 원점', extra: '1번 코너 (검은 칸 모서리) · T<sub>cam←보드</sub> 의 원점' });
      b.label(K === 'see' ? '보드' : '표본', p0.center, { color: p0.color });
      const rays = CAMS.map(c => ({ c, pairs: p0.quad.map(q => [c.C, q]) }));
      if (K === 'see') rays.forEach(r => b.lines(r.pairs, r.c.color, { opacity: 0.4, reveal: [0.5, 1.1] }));
      else {
        rays.forEach(r => b.lines(r.pairs, r.c.color, { opacity: 0.4 }));
        /* 표본 하나: 기준 카메라에서 다른 카메라 쪽으로 벡터가 자란다 */
        OTH.forEach((c, k) => {
          const e = sampleEnd(SAMPLE0, k);
          b.arrow(REF.C, e, c.color, { thick: true, reveal: [0, 1.4] });
          b.label(`${c.unit} 표본 벡터`, midOf(REF.C, e), { cls: 'k', color: c.color, reveal: [1.3, 0.4] });
        });
      }
    }
    if (K === 'gather') {
      OTH.forEach((c, k) => b.arrow(REF.C, sampleEnd(SAMPLE0, k), c.color, { thick: true }));
      const bd = b.boardDyn(POSES[HOPS[0]].quad);
      const rays = CAMS.map(c => b.raysDyn(c, POSES[HOPS[0]].quad));
      const pairs = HOPS.map(pi => OTH.map((c, k) => b.arrow(REF.C, sampleEnd(pi, k), c.color, { opacity: 0.6, head: 5 })));
      b.anim(t => {
        const u = (t - HOP0) / HOP;
        if (u < 0) { bd.mesh.visible = false; rays.forEach(r => r.set(POSES[HOPS[0]].quad, 0)); pairs.forEach(pr => pr.forEach(a => a.set(0))); return; }
        const i = Math.min(HOPS.length - 1, Math.floor(u)), f = u - i, p = POSES[HOPS[i]];
        bd.mesh.visible = true; bd.set(p.quad);
        rays.forEach(r => r.set(p.quad, easeOut(clamp01(f / 0.35))));
        pairs.forEach((pr, j) => pr.forEach(a => a.set(j < i ? 1 : j === i ? easeOut(clamp01((f - 0.25) / 0.55)) : 0)));
      });
    }
    if (solved) {
      b.board(POSES[HOPS[HOPS.length - 1]].quad, { opacity: 0.25 });
      /* 산출: 표본 벡터들이 참값으로 모이며 사라지고, 그 자리에 R·t 벡터가 자란 뒤 카메라가 실선이 되고 좌표축이 선다 */
      const all = [SAMPLE0, ...HOPS];
      const samples = all.flatMap((pi, n) => OTH.map((c, k) => ({ c, end: sampleEnd(pi, k), ar: b.arrow(REF.C, sampleEnd(pi, k), c.color, n === 0 ? { thick: true } : { opacity: 0.6, head: 5 }), o: n === 0 ? 1 : 0.6 })));
      b.anim(t => { const k = easeOut(prog(t, [0, 1.3])); samples.forEach(s => { s.ar.aim(REF.C, lerp3(s.end, s.c.C, k)); s.ar.set(1, s.o * (1 - k)); }); });
      OTH.forEach(c => {
        b.arrow(REF.C, c.C, c.color, { thick: true, reveal: [0.9, 1.3] });
        b.label(`${c.unit} R·t`, midOf(REF.C, c.C), { color: c.color, reveal: [2.1, 0.4] });
        b.camera(c, { ghost: true, label: false, reveal: [2.2, 0.6], out: true });
        b.camera(c, { reveal: [2.2, 0.6] });
        camTriad(c, 16, { reveal: [2.9, 0.8] });
      });
    }
  }

  if (S === 4) {
    b.board(ANCHOR, { ghost: true, info: anchorInfo });
    b.rack({ faint: K !== 'rack' });
    CAMS.forEach(c => b.camera(c));
    if (K === 'calib') {
      /* 파일에 적히는 순서: 기준 카메라 = 원점, 나머지 두 대의 R·t */
      camTriad(REF, 30, { cls: '', reveal: [0, 0.9] });
      b.label('world 원점', REF.C, { color: REF.color, cls: 'k', reveal: [0.8, 0.4] });
      OTH.forEach(c => { b.arrow(REF.C, c.C, c.color, { thick: true, reveal: [1.0, 1.3] }); b.label(`${c.unit} R·t`, midOf(REF.C, c.C), { color: c.color, reveal: [2.2, 0.4] }); });
    }
    if (K === 'floor') {
      /* 먼저 있던 것: 바닥 원점, 기준 카메라 벡터(1 단계), R·t(3 단계). 산출: 이어 붙인 벡터 둘 */
      worldTriad();
      b.label('world 원점', [0, 0.6, 0], { color: css('--anchor') });
      b.arrow([0, 0, 0], REF.C, '--anchor', { thick: true });
      b.label('기준 카메라 벡터', mul(REF.C, 0.5), { color: css('--anchor') });
      OTH.forEach(c => { b.arrow(REF.C, c.C, c.color, { thick: true }); b.label(`${c.unit} R·t`, midOf(REF.C, c.C), { color: c.color }); });
      OTH.forEach((c, k) => {
        b.arrow([0, 0, 0], c.C, '--anchor', { dashed: true, head: 8, reveal: [0.3 + k * 0.6, 1.3] });
        b.label(`${c.unit} 벡터`, mul(c.C, 0.5), { color: css('--anchor'), cls: 'k', reveal: [1.5 + k * 0.6, 0.4] });
      });
    }
    if (K === 'rack') {
      /* 먼저 있던 것: 바닥 원점·축, 랙(2 단계). 산출: 원점 이동 벡터가 자란 뒤 랙 좌표축이 서고 카메라 셋을 새 원점에 잇는다 */
      worldTriad();
      b.arrow([0, 0.6, 0], [RACK_O[0], 0.6, RACK_O[2]], '--rack', { thick: true, reveal: [0, 1.2] });
      rackTriad({ reveal: [1.2, 0.8] });
      b.label('world 원점', RACK_O, { color: css('--rack'), reveal: [1.9, 0.4] });
      b.lines(CAMS.map(c => [RACK_O, c.C]), '--rack', { dashed: true, opacity: 0.6, reveal: [2.2, 1.0] });
    }
  }
  if (b.bb.isEmpty()) { b.bb.expandByPoint(new THREE.Vector3(-50, 0, -50)); b.bb.expandByPoint(new THREE.Vector3(50, 50, 50)); }
  b.bb.expandByPoint(new THREE.Vector3(0, 0, 0));
  return { group: b.G, labels: b.labels, pickables: b.pickables, anims: b.anims, bbox: b.bb };
}

/* ═══════════════════ 조립 ═══════════════════ */
const host = $('#v3d');
let viewer;
try { viewer = createViewer(host); }
catch (e) { host.innerHTML = `<div class="err">3D 를 열 수 없습니다 · ${e && e.message || e}</div>`; }

/* 격벽은 단계가 바뀌어도 그대로 둔다 — 모든 비트의 장면을 합친 상자 하나로 눈금을 정한다 */
const GLOBAL_BB = new THREE.Box3();
BEATS.forEach(bt => { const s = buildScene(bt); GLOBAL_BB.union(s.bbox); disposeTree(s.group); });

const state = { i: 0, t: 0, playing: false, view: 'free' };
let raf = 0, last = 0, hold = 0, lastStage = 0;
const beat = () => BEATS[state.i];

/* 진행 막대: 단계별 묶음 안에 비트 조각, 폭은 길이에 비례 */
const bar = $('#bar'), segs = [];
{
  const byStage = {};
  BEATS.forEach((bt, i) => { (byStage[bt.stage] ||= []).push(i); });
  Object.entries(byStage).forEach(([st, idx]) => {
    const g = document.createElement('div'); g.className = 'st'; g.style.setProperty('--w', idx.reduce((s, i) => s + BEATS[i].dur, 0).toFixed(2));
    idx.forEach(i => {
      const sg = document.createElement('button'); sg.type = 'button'; sg.className = 'sg'; sg.dataset.i = i; sg.style.setProperty('--d', BEATS[i].dur.toFixed(2));
      sg.setAttribute('aria-label', `${st} ${STAGE_NAME[st]} ${BEATS[i].name}`);
      const f = document.createElement('i'); sg.appendChild(f); g.appendChild(sg); segs.push({ sg, f });
    });
    bar.appendChild(g);
  });
  bar.addEventListener('click', e => { const sg = e.target.closest('.sg'); if (sg) goto(+sg.dataset.i); });
}

function renderControls() {
  const bt = beat(), atEnd = state.i === BEATS.length - 1 && state.t >= bt.dur && !state.playing;
  $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(+x.dataset.stage === bt.stage)));
  $('#meta-stage').textContent = `${bt.stage} ${STAGE_NAME[bt.stage]} · ${bt.name}`;
  const fc = $('#meta-file'); fc.hidden = !bt.file; fc.textContent = bt.file || '';
  /* 영상 모드는 문장마다 한 줄(가운데 정렬 자막). 보통 화면은 그대로 흘려 쓴다 */
  if (VIDEO) $('#cap').innerHTML = bt.cap.split(/(?<=다\.)\s+/).map(s => s.replace(/[<>&]/g, '')).join('<br>');
  else $('#cap').textContent = bt.cap;
  const pb = $('#play'); pb.textContent = state.playing ? '일시정지' : atEnd ? '처음부터' : '재생'; pb.setAttribute('aria-pressed', String(state.playing));
  $('#prev').disabled = state.i === 0; $('#next').disabled = state.i === BEATS.length - 1;
  segs.forEach((s, i) => s.sg.setAttribute('aria-current', String(i === state.i)));
}
function renderProgress() {
  const bt = beat();
  segs.forEach((s, i) => { s.f.style.width = i < state.i ? '100%' : i === state.i ? (clamp01(state.t / bt.dur) * 100).toFixed(1) + '%' : '0'; });
}
function goto(i, { play = true, fresh = false } = {}) {
  if (!viewer) return;
  state.i = Math.max(0, Math.min(BEATS.length - 1, i)); state.t = RM ? beat().dur : 0; hold = 0;
  const bt = beat();
  const Sn = buildScene(bt); Sn.bbox = GLOBAL_BB; viewer.setScene(Sn);
  if (state.view === 'free' && (bt.stage !== lastStage || bt.view)) {
    const v = bt.view || STAGE_VIEW[bt.stage];
    viewer.tweenView(v[0], v[1], lastStage === 0 || RM || fresh ? 0 : 1.1, RENDER ? 0 : performance.now());   // 프레임 찍기 모드에서는 비트 시간이 시계다
  }
  lastStage = bt.stage;
  state.playing = RENDER ? false : play;
  viewer.frame(state.t, RENDER ? 0 : performance.now());
  renderControls(); renderProgress(); if (!RENDER) ensureLoop();
}
function ensureLoop() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
function loop(now) {
  raf = 0;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const bt = beat();
  if (state.playing) {
    if (RM) { hold += dt; if (hold >= Math.min(bt.dur, 3)) { if (state.i < BEATS.length - 1) { goto(state.i + 1); return; } if (EMBED) { goto(0); return; } state.playing = false; renderControls(); } }
    else { state.t += dt; if (state.t >= bt.dur) { if (state.i < BEATS.length - 1) { goto(state.i + 1); return; } if (EMBED) { goto(0); return; } state.t = bt.dur; state.playing = false; renderControls(); } }
  }
  viewer.frame(state.t, now);
  renderProgress();
  if (state.playing || viewer.busy()) raf = requestAnimationFrame(loop);
}
function togglePlay() {
  const bt = beat();
  if (state.playing) { state.playing = false; renderControls(); return; }
  if (state.i === BEATS.length - 1 && state.t >= bt.dur) { goto(0); return; }
  if (state.t >= bt.dur) { goto(state.i + 1); return; }
  state.playing = true; renderControls(); ensureLoop();
}
$('#play').addEventListener('click', togglePlay);
$('#prev').addEventListener('click', () => goto(state.i - 1));
$('#next').addEventListener('click', () => goto(state.i + 1));
$('#tabs').addEventListener('click', e => {
  const bt = e.target.closest('button[data-stage]'); if (!bt) return;
  const st = +bt.dataset.stage;
  goto(BEATS.findIndex(x => x.stage === st));
  try { history.replaceState(null, '', '#s' + st); } catch (_) { /* 주소 바꾸기 막힘 */ }
});
$('#views').addEventListener('click', e => {
  const bt = e.target.closest('button[data-view]'); if (!bt) return;
  state.view = bt.dataset.view;
  $('#views').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === bt)));
  if (!viewer) return;
  if (state.view === 'free') { const v = beat().view || STAGE_VIEW[beat().stage]; viewer.setView('free'); viewer.tweenView(v[0], v[1], 0); }
  else viewer.setView(state.view);
  viewer.frame(state.t, performance.now());
});
document.addEventListener('keydown', e => {
  if (e.target.closest('button')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') goto(state.i + 1);
  else if (e.key === 'ArrowLeft') goto(state.i - 1);
});
const stageFromHash = () => (/^#s[1-4]$/.test(location.hash) ? +location.hash[2] : 0);
addEventListener('hashchange', () => { const st = stageFromHash(); if (st) goto(BEATS.findIndex(x => x.stage === st)); });
if (RENDER) {
  window.__beats = BEATS.map(x => ({ stage: x.stage, dur: x.dur, name: x.name }));
  window.__seek = (i, t, fresh = false) => { if (i !== state.i || fresh) goto(i, { fresh }); state.t = t; viewer.frame(t, t * 1000); renderProgress(); };
  goto(0, { fresh: true });
  document.fonts.ready.then(() => { window.__ready = true; });
} else {
  const st = stageFromHash();
  goto(st ? BEATS.findIndex(x => x.stage === st) : 0, { play: !RM });
  /* 끼워 넣기: 화면 밖으로 나가면 멈추고, 돌아오면 이어서 돈다(한 페이지에 애니메이션 다섯이 같이 돌지 않게) */
  if (EMBED && 'IntersectionObserver' in window && !RM) {
    let seen = true;
    new IntersectionObserver(es => {
      const on = es.some(e => e.isIntersecting);
      if (on === seen) return; seen = on;
      if (on) { if (!state.playing) { state.playing = true; renderControls(); ensureLoop(); } }
      else if (state.playing) { state.playing = false; renderControls(); }
    }, { threshold: 0.05 }).observe(document.body);
  }
}
</script>

</body></html>
