<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><script>/* embed 와 바탕색을 그리기 전에 붙인다. JS 가 돈 뒤에 붙이면 원래 버튼이 한순간 보인다 */(() => { const q = new URLSearchParams(location.search); if (q.get('embed') !== '1') return; document.body.classList.add('embed'); const bg = q.get('bg') || ''; if (/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(bg)) document.documentElement.style.setProperty('--bg', '#' + bg); })();</script>
<title>렌즈 내재변수 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 「위치 보정 3단계」와 같다 — 3D 뷰(격벽 뷰어)가 뷰포트 전체, 단계 탭은 왼쪽 위, 슬라이더·시점·층 조작은 왼쪽 아래,
   카메라가 보는 이미지는 오른쪽 아래 작은 창. 설명 패널은 없다. 숫자는 슬라이더 값과 점 툴팁에만 둔다.
   탭은 리그 파이프라인의 렌즈 보정 순서 그대로다: 촬영 조건 → 촬영 → 코너 검출 → K 산출 → hold-out 검산 → K 파일 */
:root{
  --bg:#e9edf2; --panel:#ffffff; --pane:#f2f5f8; --grid:#c9d2db; --edge:#aeb9c4;
  --fg:#1b1f27; --muted:#5b6270; --line:#d5dce4; --accent:#1f5fb0; --spike:#1b1f27;
  --plane:#2E7DD1; --pp:#a8307f; --pt:#d2571f; --ideal:#7a838f; --gridline:#3a4150; --anchor:#c99400; --est:#2E7DD1; --ok:#1f8a5b;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
/* 밝은 테마 하나로 고정 — 어두운 테마 토큰은 두지 않는다 */

html,body{height:100%}
body{margin:0;padding:0;background:var(--panel);color:var(--fg);font:14px/1.5 var(--font);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 떠 있는 조작: 탭(왼쪽 위) · 툴바(왼쪽 아래) · 이미지 창(오른쪽 아래). 시스템 바와 안전 영역만큼 띄운다 */
/* 탭은 작게 — 화면 왼쪽 위에 한 줄, 그림을 가리지 않게 */
.tabs{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 20px)}
.tabs button{padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);font-weight:500;font-size:11px;line-height:1.3;display:flex;gap:5px;align-items:center;color:var(--muted)}
.tabs button b{font:600 9.5px/1 var(--mono);color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs button[aria-selected="true"] b{color:var(--accent)}

.wrap{position:fixed;inset:0}
.v3d{position:absolute;inset:0;background:var(--panel);overflow:hidden;touch-action:none}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov .tick{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 10.5px/1 var(--mono);color:var(--muted);will-change:transform}
.ov .ttl{font-weight:700;color:var(--fg)}
.ov .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 11px/1.2 var(--mono);padding:2px 4px;color:var(--fg);will-change:transform}
.ov .lbl.k{font-weight:500;color:var(--muted)}
.ov .lead{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ov .lead line{stroke-width:1.2;opacity:.8}
.ov .lead circle{opacity:.9}
.ov .tip{position:absolute;left:0;top:0;display:none;z-index:3;padding:6px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 11px/1.45 var(--mono);white-space:nowrap}
.ov .tip div+div{color:var(--muted);font-weight:500}
.hint{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));font:500 11px/1 var(--mono);color:var(--muted);pointer-events:none}

.toolbar{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 24px)}
@media (min-width:641px){ body.has-inset .toolbar{max-width:calc(100% - 24px - min(300px,38vw) - 16px)} }   /* 이미지 창과 안 겹치게 */
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.seg button{padding:6px 11px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[disabled]{opacity:.45;cursor:default}
.seg button.pri:not([disabled]){background:var(--accent);color:#fff}
.layers{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.layers label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.layers input{accent-color:var(--accent);margin:0}
/* 단계별 슬라이더 묶음 — 탭이 바뀌면 그 단계 것만 보인다 */
.ctls{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.ctl{display:grid;grid-template-columns:auto 110px auto auto;gap:6px;align-items:center;font:500 11.5px/1.2 var(--mono);color:var(--muted)}
.ctl label{color:var(--fg);font-weight:600;white-space:nowrap}
.ctl input[type=range]{width:110px;margin:0;accent-color:var(--accent)}
.ctl output{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.ctl .u{min-width:2ch}

/* 카메라가 보는 이미지 — 오른쪽 아래 작은 창. 좁은 화면에서는 숨긴다 */
.inset{position:absolute;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));
  width:min(300px,38vw);aspect-ratio:1920/1200;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--pane)}
.inset canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.inset .cap{position:absolute;left:7px;top:5px;font:600 10.5px/1 var(--mono);color:var(--muted);pointer-events:none}
@media (max-width:640px){ .inset{display:none} .hint{display:none} }   /* 좁은 화면에서는 탭과 겹치는 조작 안내도 숨긴다 */
/* 사이트 끼워 넣기용(?embed=1&bg=eceef1): 탭을 숨기고 단계를 차례로 돌린다. 얇은 진행 막대 하나와 상자 없는 자막만. 바탕은 ?bg= 로 받는다 */
body.embed{background:var(--bg)}
body.embed .v3d{background:transparent;bottom:92px}
body.embed .tabs{display:none}
body.embed .inset{bottom:auto;top:12px;right:12px}
.player{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.player .card{width:min(820px,100%);display:grid;gap:10px;justify-items:center;text-align:center}
.player .cap{display:grid;align-content:end;margin:0;font-size:1.125rem;word-break:keep-all;line-height:1.5;min-height:3em;text-wrap:balance}
.player .bar{width:100%;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--accent)}
@media (max-width:560px){ body.embed .v3d{bottom:112px} .player .cap{min-height:4.5em} }
.err{display:flex;align-items:center;justify-content:center;height:100%;font:600 12px/1.4 var(--mono);color:var(--muted);padding:16px;text-align:center}
/* 숨김: 조작 안내 · 시점/층 줄. 단계 탭은 작게 남긴다(주소의 #s1~#s6 도 됨, hashchange 에 반응) */
.hint,.toolbar .row{display:none!important}
</style>

<main class="wrap">
  <div class="v3d" id="v3d"></div>
  <!-- 탭 순서 = 리그 파이프라인의 렌즈 보정 순서. 카메라 몸체마다 한 번 -->
  <nav class="tabs" id="tabs" role="tablist" aria-label="단계">
    <button role="tab" data-stage="1" aria-selected="true"><b>1</b>촬영 조건</button>
    <button role="tab" data-stage="2" aria-selected="false"><b>2</b>촬영</button>
    <button role="tab" data-stage="3" aria-selected="false"><b>3</b>코너 검출</button>
    <button role="tab" data-stage="4" aria-selected="false"><b>4</b>K 산출</button>
    <button role="tab" data-stage="5" aria-selected="false"><b>5</b>hold-out 검산</button>
    <button role="tab" data-stage="6" aria-selected="false"><b>6</b>K 파일</button>
  </nav>
  <!-- 툴바: 단계별 슬라이더·산출 버튼은 뺐다(자세·묶음·산출 상태는 state 의 고정값). 아래 줄도 CSS 로 숨긴다 -->
  <div class="toolbar" id="toolbar">
    <div class="row">
      <div class="seg" id="views" aria-label="시점">
        <button data-view="free" aria-pressed="true">자유</button>
        <button data-view="top" aria-pressed="false">위</button>
        <button data-view="front" aria-pressed="false">정면</button>
        <button data-view="side" aria-pressed="false">옆</button>
      </div>
      <div class="layers" id="layers">
        <label><input type="checkbox" id="ly-axes" checked>좌표축</label>
        <label><input type="checkbox" id="ly-fov" checked>시야</label>
        <label><input type="checkbox" id="ly-grid" checked>격자</label>
        <label><input type="checkbox" id="ly-rays" checked>광선</label>
        <label><input type="checkbox" id="ly-inset" checked>카메라 이미지</label>
      </div>
    </div>
  </div>
  <div class="inset" id="inset" aria-label="카메라가 보는 이미지"><canvas id="imgview"></canvas><span class="cap">카메라 이미지 · 1920×1200 px</span></div>
  <!-- 끼워 넣기 모드에서만 보인다: 단계 자막과 진행 막대 -->
  <div class="player" id="player" hidden>
    <div class="card"><p class="cap" id="cap"></p><div class="bar" aria-label="진행"><i id="fill"></i></div></div>
  </div>
</main>

<script type="module">
let THREE;
try { THREE = await import('/vendor/three/three.module.min.js'); }
catch (_) { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'); }

/* ═══════════════════ 데이터 ═══════════════════
   video0 의 렌즈 보정값(OpenCV calibrateCamera, flag 없음). 1920×1200 px · 사진 114장 · 재투영 RMS 0.449 px · 가로 화각 103.68°.
   장면 비율 1 px = 0.1 cm. 광학 중심 C 는 높이 100 cm 에 두고, 격벽의 x·z·높이 축은 카메라 좌표 X·Z·(100 − Y) 다.
   보드 자세는 결정적 난수로 만든 예시이고, 검출 픽셀은 그 자세를 실제 보정값으로 투영한 것이다.
   문턱값은 backend/service/calibration 의 상수: 뷰 8장 이상 · 뷰당 코너 6 이상 · hold-out 묶음 6(자리 3 × 좌우 2) · 사람이 서는 깊이 2.2 m(코드의 WORK_DIST_MM) */
const CALIB = { fx: 754.39, fy: 754.07, cx: 958.39, cy: 589.31, k1: 0.02881, k2: -0.07958, k3: 0.01993, p1: 0.000553, p2: -0.001256 };
const FILE = { rms: 0.449, views: 114, hfov: 103.68 };
const IMG_W = 1920, IMG_H = 1200;
const PX = 0.1, H0 = 100;
const RANGE = { x: [-150, 150], y: [0, 250], z: [-50, 350] }, STEP = 50;     // 격벽은 고정 — 슬라이더를 움직여도 눈금이 안 바뀐다
const BOARD = { W: 36, H: 54, sq: 9 };                                           // ChArUco 4×6 · 90mm
const N_MAX = 24, N_VIEWS = 10, N_GROUPS = 6, MIN_VIEWS = 8, MIN_CORNERS = 6, DEPTH = 220;   // N_VIEWS = 화면에 쓰는 자세 수(고정) · DEPTH = 사람이 서는 깊이(cm), px 오차를 cm 로 바꾸는 기준

/* ── 작은 수학 ── */
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const nrm = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => mul(a, 1 / (nrm(a) || 1));
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const fmt = (v, n = 1) => { const s = (Math.round(Math.abs(v) * 10 ** n) / 10 ** n).toFixed(n); return (v < 0 && s !== (0).toFixed(n) ? '−' : '') + s; };
const pad2 = n => String(n).padStart(2, '0');

/* ── 핀홀 + 왜곡 모델(OpenCV 식: 나누기 → 왜곡 → K). 보정은 이 식의 빈칸 9개를 채우는 일이다 ── */
const distort = (xp, yp, c) => {
  const r2 = xp * xp + yp * yp, r4 = r2 * r2, r6 = r4 * r2;
  const rad = 1 + c.k1 * r2 + c.k2 * r4 + c.k3 * r6;
  return [xp * rad + 2 * c.p1 * xp * yp + c.p2 * (r2 + 2 * xp * xp), yp * rad + c.p1 * (r2 + 2 * yp * yp) + 2 * c.p2 * xp * yp];
};
const ZERO = { k1: 0, k2: 0, k3: 0, p1: 0, p2: 0 };
const COEF = { k1: CALIB.k1, k2: CALIB.k2, k3: CALIB.k3, p1: CALIB.p1, p2: CALIB.p2 };
const KC = { fx: CALIB.fx, fy: CALIB.fy, cx: CALIB.cx, cy: CALIB.cy };
/* calibrateCamera 의 첫 추정: 왜곡 0, fx·fy 는 호모그래피에서(여기서는 8% 크게 잡힌 예시), 주점은 이미지 가운데 */
const K0 = { fx: CALIB.fx * 1.08, fy: CALIB.fy * 1.08, cx: 960, cy: 600 };
const distortedPx = (u, v, G, c) => { const d = distort((u - G.cx) / G.fx, (v - G.cy) / G.fy, c); return [G.fx * d[0] + G.cx, G.fy * d[1] + G.cy]; };
const camToDisp = (X, Y, Z) => [X, H0 - Y, Z];                                   // 카메라 좌표(x 오른쪽·y 아래·z 앞) → 격벽 좌표(x, 높이, z)
const pxToDisp = (u, v) => { const D = KC.fx * PX; return camToDisp((u - KC.cx) * PX, (v - KC.cy) * PX * KC.fx / KC.fy, D); };
/* 격벽 좌표의 점 → 픽셀. K 와 왜곡 계수를 골라 넣는다(검출 = 실제값, 재투영 = 지금 모델) */
const toPix = (p, K, c) => { const X = p[0], Y = H0 - p[1], Z = p[2]; const d = distort(X / Z, Y / Z, c); return [K.fx * d[0] + K.cx, K.fy * d[1] + K.cy]; };

/* ── 보정 촬영 자세(예시, 결정적 난수) — 시야 안 0.9~2.6 m, 패턴면은 카메라 쪽으로 살짝 기울여 ── */
const C0 = camToDisp(0, 0, 0);
const HFOV2 = Math.atan(960 / CALIB.fx), VFOV2 = Math.atan(600 / CALIB.fy);
const POSES = Array.from({ length: N_MAX }, (_, k) => {
  const r = n => { const x = Math.sin(k * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };   // 결정적 난수(흔한 해시) — 자세가 한쪽에 몰리지 않게
  const d = 90 + 170 * r(1);
  const ax = (r(2) - 0.5) * 2 * HFOV2 * 0.75, ay = (r(3) - 0.5) * 2 * VFOV2 * 0.55;
  const c = camToDisp(d * Math.tan(ax), d * Math.tan(ay), d); c[1] = Math.max(c[1], 30);   // 바닥 아래로 내려가지 않게
  const n = unit(add(unit(sub(C0, c)), [(r(4) - 0.5) * 0.7, (r(5) - 0.5) * 0.7, 0]));
  const u = unit(cross([0, 1, 0], n)), v = cross(n, u);                        // u = 짧은 변(x_b) · v = 긴 변(y_b)
  const quad = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([su, sv]) => add(c, add(mul(u, BOARD.W / 2 * su), mul(v, BOARD.H / 2 * sv))));
  const corners = [];                                                            // 체스판 안쪽 코너 3×5 = 15
  for (let j = 1; j <= 5; j++) for (let i = 1; i <= 3; i++) corners.push({ i, j, p: add(quad[0], add(mul(u, BOARD.sq * i), mul(v, BOARD.sq * j))) });
  return { k, no: k + 1, group: k % N_GROUPS + 1, dist: d, center: c, quad, corners };
});
/* 처음 고르는 자세 = 10장 중 이미지 가장자리에 가장 가까운 것. 왜곡 잔차가 거기서 가장 크게 보인다 */
const PICK0 = POSES.slice(0, N_VIEWS).reduce((best, p) => { const X = p.center[0], Y = H0 - p.center[1], Z = p.center[2], r2 = (X * X + Y * Y) / (Z * Z); return r2 > best.r2 ? { r2, no: p.no } : best; }, { r2: -1, no: 1 }).no;

/* ═══════════════════ 상태 — 조작은 단계 탭뿐. pick(3·4 단계 자세)·hold(5 단계 뺄 묶음)·solvedK(4 단계 산출 전/뒤)는 고정값 ═══════════════════ */
const state = { stage: 1, view: 'free', layers: { axes: true, fov: true, grid: true, rays: true, inset: true }, views: N_VIEWS, pick: PICK0, solvedK: false, hold: 2 };
const $ = (s, el = document) => el.querySelector(s);
/* ?embed=1 — 사이트에 끼워 넣는 화면: 단계를 차례로 돌리고 자막과 진행 막대만 보인다. ?bg=eceef1 — 바탕색(섹션과 같게) */
const Q = new URLSearchParams(location.search), EMBED = Q.get('embed') === '1';
if (EMBED) {
  document.body.classList.add('embed');
  const bg = Q.get('bg') || '';
  if (/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(bg)) document.documentElement.style.setProperty('--bg', '#' + bg);
}

/* ═══════════════════ 뷰어 (「위치 보정 3단계」의 격벽·눈금·점 짚기·궤도·지시선 칩을 그대로 옮김) ═══════════════════ */
const VIEWS = { free: [2.45, 1.12], top: [Math.PI, 0.05], front: [Math.PI, 1.42], side: [Math.PI / 2, 1.42] };
const pickStep = span => [5, 10, 20, 25, 50, 100, 200].find(s => span / s <= 9) || 500;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const hex = name => new THREE.Color(css(name));

function createViewer(host, { reserve = () => ({ L: 0, R: 0 }) } = {}) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  host.appendChild(renderer.domElement);
  const overlay = document.createElement('div'); overlay.className = 'ov'; host.appendChild(overlay);
  const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = '끌어서 돌리기 · 휠·핀치로 확대 · 점을 짚으면 좌표'; host.appendChild(hint);
  const tip = document.createElement('div'); tip.className = 'tip'; overlay.appendChild(tip);
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const lead = document.createElementNS(SVG_NS, 'svg'); lead.setAttribute('class', 'lead'); overlay.prepend(lead);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(42, 1, 1, 6000);
  let theta = VIEWS.free[0], phi = VIEWS.free[1], radius = 400, userZoomed = false, needFit = true;
  let S = null, W = null, picked = null;
  const labelEls = [];
  const tickEls = [];

  /* 격벽 3면 — 바닥은 y=0 에 잠근다. 벽은 카메라 반대쪽으로 옮겨 간다 */
  function buildWalls(R, step) {
    if (W) { scene.remove(W.group); W.group.traverse(o => { o.geometry && o.geometry.dispose(); o.material && o.material.dispose(); }); }
    tickEls.splice(0).forEach(t => t.el.remove());
    const g = new THREE.Group(); scene.add(g);
    const paneMat = new THREE.MeshBasicMaterial({ color: hex('--pane'), side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    const gridMat = new THREE.LineBasicMaterial({ color: hex('--grid') });
    const edgeMat = new THREE.LineBasicMaterial({ color: hex('--edge') });
    const ticks = a => { const o = []; for (let v = R[a][0]; v <= R[a][1] + 1e-6 && o.length < 200; v += step) o.push(v); return o; };
    const size = a => R[a][1] - R[a][0], mid = a => (R[a][0] + R[a][1]) / 2;
    const mkWall = (u, v, n) => {
      const w = new THREE.Group();
      const pane = new THREE.Mesh(new THREE.PlaneGeometry(size(u), size(v)), paneMat);
      if (n === 'y') pane.rotation.x = -Math.PI / 2; else if (n === 'x') pane.rotation.y = Math.PI / 2;
      w.add(pane);
      const seg = [], edge = [];
      const P = (a, va, b, vb) => { const p = new THREE.Vector3(); p[a] = va; p[b] = vb; return p; };
      ticks(u).forEach((t, i, arr) => (i === 0 || i === arr.length - 1 ? edge : seg).push(P(u, t, v, R[v][0]), P(u, t, v, R[v][1])));
      ticks(v).forEach((t, i, arr) => (i === 0 || i === arr.length - 1 ? edge : seg).push(P(v, t, u, R[u][0]), P(v, t, u, R[u][1])));
      const c = new THREE.Vector3(); c[u] = mid(u); c[v] = mid(v);
      const local = arr => arr.map(p => p.clone().sub(c));
      w.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(local(seg)), gridMat));
      w.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(local(edge)), edgeMat));
      w.position.copy(c); g.add(w); return w;
    };
    const floor = mkWall('x', 'z', 'y'), back = mkWall('x', 'y', 'z'), side = mkWall('z', 'y', 'x');
    floor.position.y = R.y[0];
    const far = { x: R.x[1], z: R.z[0] }, near = { x: R.x[0], z: R.z[1] };
    const mkText = (txt, cls) => { const d = document.createElement('div'); d.className = 'tick' + (cls ? ' ' + cls : ''); d.textContent = txt; overlay.appendChild(d); return d; };
    const off = step * 0.45, tOff = step * 1.3;
    ticks('x').forEach(t => tickEls.push({ el: mkText(String(Math.round(t))), at: () => new THREE.Vector3(t, R.y[0], near.z + (near.z > far.z ? off : -off)) }));
    ticks('z').forEach(t => tickEls.push({ el: mkText(String(Math.round(t))), at: () => new THREE.Vector3(near.x + (near.x > far.x ? off : -off), R.y[0], t) }));
    ticks('y').forEach(t => tickEls.push({ el: mkText(String(Math.round(t))), at: () => new THREE.Vector3(near.x + (near.x > far.x ? off : -off), t, far.z) }));
    tickEls.push({ el: mkText('x (cm)', 'ttl'), at: () => new THREE.Vector3(mid('x'), R.y[0], near.z + (near.z > far.z ? tOff : -tOff)) });
    tickEls.push({ el: mkText('z (cm)', 'ttl'), at: () => new THREE.Vector3(near.x + (near.x > far.x ? tOff : -tOff), R.y[0], mid('z')) });
    tickEls.push({ el: mkText('높이 (cm)', 'ttl'), at: () => new THREE.Vector3(near.x + (near.x > far.x ? tOff : -tOff), mid('y'), far.z) });
    const spikeGeo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 6 }, () => new THREE.Vector3()));
    const spike = new THREE.LineSegments(spikeGeo, new THREE.LineDashedMaterial({ color: hex('--spike'), dashSize: step * 0.12, gapSize: step * 0.08, transparent: true, opacity: 0.85 }));
    const marker = new THREE.Mesh(new THREE.SphereGeometry(Math.max(1.2, step * 0.06), 10, 10), new THREE.MeshBasicMaterial({ color: hex('--spike') }));
    spike.visible = marker.visible = false; g.add(spike, marker);
    const target = new THREE.Vector3(mid('x'), mid('y'), mid('z'));
    const c0 = target.clone();
    const fitRadius = aspect => {
      const s = Math.hypot(size('x') + 2 * tOff, size('y'), size('z') + 2 * tOff) / 2;
      const half = Math.min(cam.fov / 2, Math.atan(Math.tan(cam.fov / 2 * Math.PI / 180) * aspect) * 180 / Math.PI) * Math.PI / 180;
      return s / Math.sin(half) * 0.74;
    };
    const layoutSpike = () => {
      if (!picked) return;
      const p = picked.p, a = spikeGeo.attributes.position;
      [p, new THREE.Vector3(p.x, R.y[0], p.z), p, new THREE.Vector3(p.x, p.y, far.z), p, new THREE.Vector3(far.x, p.y, p.z)].forEach((q, i) => a.setXYZ(i, q.x, q.y, q.z));
      a.needsUpdate = true; spike.computeLineDistances();
    };
    const apply = () => {
      cam.position.set(target.x + radius * Math.sin(phi) * Math.sin(theta), target.y + radius * Math.cos(phi), target.z + radius * Math.sin(phi) * Math.cos(theta));
      cam.lookAt(target);
      const fx = cam.position.x > c0.x ? 0 : 1, fz = cam.position.z > c0.z ? 0 : 1;
      far.x = R.x[fx]; near.x = R.x[1 - fx]; far.z = R.z[fz]; near.z = R.z[1 - fz];
      side.position.x = far.x; back.position.z = far.z;
      layoutSpike();
    };
    W = { group: g, R, step, apply, fitRadius, spike, marker, layoutSpike, target, key: ['x', 'y', 'z'].map(a => R[a].join(':')).join('|') };
  }

  const tmp = new THREE.Vector3();
  const place = (el, p, dx, dy) => {
    tmp.copy(p).project(cam);
    const hidden = tmp.z > 1 || Math.abs(tmp.x) > 1.3 || Math.abs(tmp.y) > 1.3;
    el.style.visibility = hidden ? 'hidden' : 'visible';
    if (!hidden) el.style.transform = `translate(${dx || '-50%'},${dy || '-50%'}) translate(${((tmp.x + 1) / 2 * renderer.domElement.clientWidth).toFixed(1)}px,${((1 - tmp.y) / 2 * renderer.domElement.clientHeight).toFixed(1)}px)`;
  };
  /* 이름표 배치: 그림 위에 두지 않는다. 닻점이 장면 중심의 왼쪽이면 왼쪽 여백 열, 오른쪽이면 오른쪽 여백 열에
     닻점 높이 순으로 세우고(겹치면 위아래로 비킴), 칩 테두리에서 닻점까지 지시선을 긋는다. 축 글자(pin)만 제자리.
     열 아래쪽은 툴바(왼쪽)·이미지 창(오른쪽) 높이만큼 비워 둔다 */
  const layoutLabels = (Wd, Hd) => {
    const proj = p => { tmp.copy(p).project(cam); return { x: (tmp.x + 1) / 2 * Wd, y: (1 - tmp.y) / 2 * Hd, hidden: tmp.z > 1 || Math.abs(tmp.x) > 1.3 || Math.abs(tmp.y) > 1.3 }; };
    const c = W ? proj(W.target) : { x: Wd / 2, y: Hd / 2 };
    const M = 10, GAP = 5, cols = { L: [], R: [] }, res = reserve();
    labelEls.forEach(l => {
      const a = proj(l.pos);
      const show = v => { l.el.style.visibility = v ? 'visible' : 'hidden'; if (l.line) l.line.style.display = l.dot.style.display = v ? '' : 'none'; };
      if (a.hidden) { show(false); return; }
      if (l.pin) { show(true); l.el.style.transform = `translate(-50%,-50%) translate(${a.x.toFixed(1)}px,${a.y.toFixed(1)}px)`; return; }
      cols[a.x < c.x ? 'L' : 'R'].push({ l, ax: a.x, ay: a.y, y: a.y, hw: l.w / 2, hh: l.h / 2, show });
    });
    Object.entries(cols).forEach(([side, items]) => {
      const bottom = Hd - M - (res[side] || 0);
      items.sort((p, q) => p.ay - q.ay);
      for (let i = 0; i < items.length; i++) { const it = items[i], up = items[i - 1]; it.y = Math.max(it.y, it.hh + M, up ? up.y + up.hh + it.hh + GAP : -1e9); }
      for (let i = items.length - 1; i >= 0; i--) { const it = items[i], dn = items[i + 1]; it.y = Math.min(it.y, bottom - it.hh, dn ? dn.y - dn.hh - it.hh - GAP : 1e9); }
      items.forEach(it => {
        const { l } = it, x = side === 'L' ? M + it.hw : Wd - M - it.hw; it.show(true);
        l.el.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px,${it.y.toFixed(1)}px)`;
        const vx = it.ax - x, vy = it.ay - it.y;
        const s = Math.min(Math.abs(vx) > 1e-3 ? it.hw / Math.abs(vx) : 1e9, Math.abs(vy) > 1e-3 ? it.hh / Math.abs(vy) : 1e9);
        if (s >= 1) { l.line.style.display = l.dot.style.display = 'none'; return; }
        l.line.setAttribute('x1', (x + vx * s).toFixed(1)); l.line.setAttribute('y1', (it.y + vy * s).toFixed(1));
        l.line.setAttribute('x2', it.ax.toFixed(1)); l.line.setAttribute('y2', it.ay.toFixed(1));
        l.dot.setAttribute('cx', it.ax.toFixed(1)); l.dot.setAttribute('cy', it.ay.toFixed(1));
      });
    });
  };
  const draw = () => {
    renderer.render(scene, cam);
    if (!window.__hwReady) { window.__hwReady = true; requestAnimationFrame(() => { if (parent !== window) { try { parent.postMessage({ hw: 'ready', page: location.pathname }, '*'); } catch (_) { /* no parent */ } } }); }   // 첫 프레임을 그린 뒤 끼워 넣는 쪽(viewer-tabs.js)에 알린다
    tickEls.forEach(t => place(t.el, t.at()));
    layoutLabels(renderer.domElement.clientWidth, renderer.domElement.clientHeight);
    if (picked) place(tip, picked.p, '12px', '-100%');
  };
  const showPick = info => {
    picked = info;
    if (W) { W.spike.visible = W.marker.visible = !!info; }
    tip.style.display = info ? 'block' : 'none';
    if (!info || !W) return;
    W.marker.position.copy(info.p);
    tip.innerHTML = `<div style="color:${info.color}">${info.name}</div><div>x ${fmt(info.p.x)} · 높이 ${fmt(info.p.y)} · z ${fmt(info.p.z)} cm</div>` + (info.extra ? `<div>${info.extra}</div>` : '');
    W.layoutSpike();
  };
  const ray = new THREE.Raycaster();
  const pickAt = (x, y, touch) => {
    if (!S) return null;
    const r = renderer.domElement.getBoundingClientRect();
    ray.params.Points.threshold = (W ? W.step : 10) * (touch ? 0.6 : 0.3);
    ray.setFromCamera(new THREE.Vector2((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1), cam);
    const hit = ray.intersectObjects(S.pickables, false)[0];
    if (!hit) return null;
    const o = hit.object, u = o.userData;
    return { p: u.center ? u.center.clone() : o.position.clone(), name: u.name, extra: u.extra || null, color: u.color || css('--fg') };
  };

  /* 입력: 1 포인터 회전 · 2 포인터 핀치 · 탭 = 점 짚기 · 휠 확대 */
  const el = renderer.domElement, pts = new Map();
  let drag = null, pinch = null, tap = null;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  const setRadius = r => { const span = W ? Math.max(W.R.x[1] - W.R.x[0], W.R.y[1] - W.R.y[0], W.R.z[1] - W.R.z[0]) : 300; radius = Math.min(span * 6, Math.max(span * 0.45, r)); userZoomed = true; };
  el.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* 합성 이벤트 */ }
    if (pts.size === 1) { drag = [e.clientX, e.clientY]; pinch = null; tap = [e.clientX, e.clientY]; }
    else if (pts.size === 2) { drag = null; tap = null; pinch = { d0: dist(), r0: radius }; }
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) {
      if (e.buttons === 0 && pts.size === 0) { const hit = pickAt(e.clientX, e.clientY, e.pointerType !== 'mouse'); if (hit) { showPick(hit); draw(); } else if (picked && !picked.sticky) { showPick(null); draw(); } }
      return;
    }
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && pts.size >= 2) { const d = dist(); if (d > 0) { setRadius(pinch.r0 * pinch.d0 / d); W && W.apply(); draw(); } return; }
    if (!drag) return;
    if (tap && Math.hypot(e.clientX - tap[0], e.clientY - tap[1]) > 8) tap = null;
    theta -= (e.clientX - drag[0]) * 0.006;
    phi = Math.min(1.52, Math.max(0.05, phi - (e.clientY - drag[1]) * 0.006));
    drag = [e.clientX, e.clientY]; W && W.apply(); draw();
  });
  const lift = e => {
    const wasTap = tap && pts.size === 1 && pts.has(e.pointerId);
    pts.delete(e.pointerId); pinch = null;
    drag = pts.size === 1 ? [...pts.values()][0].slice() : null;
    if (wasTap) { const hit = pickAt(e.clientX, e.clientY, e.pointerType !== 'mouse'); if (hit) hit.sticky = true; showPick(hit); draw(); }
    tap = null;
  };
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, lift));
  el.addEventListener('pointerleave', e => { if (e.buttons === 0 && pts.size === 0 && picked && !picked.sticky) { showPick(null); draw(); } });
  el.addEventListener('wheel', e => { e.preventDefault(); setRadius(radius * (1 + e.deltaY * 0.001)); W && W.apply(); draw(); }, { passive: false });

  const fit = () => {
    const r = host.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return;
    renderer.setSize(r.width, r.height, false);
    cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
    if (!W) return;
    if (!userZoomed && needFit) { radius = W.fitRadius(cam.aspect); needFit = false; }
    W.apply(); draw();
  };
  new ResizeObserver(() => { needFit = true; fit(); }).observe(host);

  return {
    setView(name) { const v = VIEWS[name] || VIEWS.free; theta = v[0]; phi = v[1]; userZoomed = false; needFit = true; fit(); },
    setScene(Sn) {
      const keep = picked ? { name: picked.name, sticky: picked.sticky } : null;
      if (S) { scene.remove(S.group); S.group.traverse(o => { o.geometry && o.geometry.dispose(); if (o.material && !o.material.userData.keep) o.material.dispose(); }); }
      labelEls.splice(0).forEach(l => { l.el.remove(); if (l.line) { l.line.remove(); l.dot.remove(); } });
      S = Sn; scene.add(S.group);
      S.labels.forEach(l => {
        const d = document.createElement('div'); d.className = 'lbl' + (l.cls ? ' ' + l.cls : ''); d.innerHTML = l.text; if (l.color) d.style.color = l.color; overlay.appendChild(d);
        const it = { el: d, pos: l.pos, pin: !!l.pin, w: d.offsetWidth, h: d.offsetHeight, line: null, dot: null };
        if (!it.pin) {
          const stroke = l.color || css('--muted');
          it.line = document.createElementNS(SVG_NS, 'line'); it.line.setAttribute('stroke', stroke); lead.appendChild(it.line);
          it.dot = document.createElementNS(SVG_NS, 'circle'); it.dot.setAttribute('r', '2'); it.dot.setAttribute('fill', stroke); lead.appendChild(it.dot);
        }
        labelEls.push(it);
      });
      /* 격벽 범위: 장면이 주면 그대로(이 페이지는 고정), 없으면 bbox 에서 */
      let R, step;
      if (Sn.range) { R = Sn.range; step = Sn.step || pickStep(Math.max(R.x[1] - R.x[0], R.y[1] - R.y[0], R.z[1] - R.z[0])); }
      else {
        const bb = S.bbox, span = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z, 40);
        step = pickStep(span * 1.16); const pad = span * 0.08;
        const lo = v => Math.floor((v - pad) / step) * step, hi = v => Math.ceil((v + pad) / step) * step;
        R = { x: [lo(bb.min.x), hi(bb.max.x)], y: [bb.min.y >= -pad ? 0 : lo(bb.min.y), hi(bb.max.y)], z: [lo(bb.min.z), hi(bb.max.z)] };
      }
      const key = ['x', 'y', 'z'].map(a => R[a].join(':')).join('|');
      if (!W || W.key !== key) { buildWalls(R, step); needFit = true; }
      picked = null; tip.style.display = 'none'; W.spike.visible = W.marker.visible = false;
      if (keep) { const o = S.pickables.find(p => p.userData.name === keep.name); if (o) { const u = o.userData; showPick({ p: u.center ? u.center.clone() : o.position.clone(), name: u.name, extra: u.extra || null, color: u.color, sticky: keep.sticky }); } }
      fit();
    },
    redraw() { W && W.apply(); draw(); },
  };
}

/* ═══════════════════ 장면 만들기 ═══════════════════ */
const TEX = (() => {
  const c = document.createElement('canvas'); c.width = 4 * 32; c.height = 6 * 32; const g = c.getContext('2d');
  g.fillStyle = '#f4f1e8'; g.fillRect(0, 0, c.width, c.height);
  for (let j = 0; j < 6; j++) for (let i = 0; i < 4; i++) {
    if ((i + j) % 2 === 0) { g.fillStyle = '#232629'; g.fillRect(i * 32, j * 32, 32, 32); }
    else { g.fillStyle = '#232629'; g.fillRect(i * 32 + 8, j * 32 + 8, 16, 16); g.fillStyle = '#f4f1e8'; g.fillRect(i * 32 + 12, j * 32 + 12, 4, 4); g.fillRect(i * 32 + 16, j * 32 + 16, 4, 4); }
  }
  /* flipY 를 끄면 uv (0,0) 이 캔버스 왼쪽 위 = 첫 칸(검은 칸)이 된다. 보드 원점이 검은 칸 모서리에 오도록 */
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; return t;
})();

function sceneBuilder() {
  const G = new THREE.Group(), labels = [], pickables = [], bb = new THREE.Box3();
  const V = p => new THREE.Vector3(p[0], p[1], p[2]);
  const grow = p => bb.expandByPoint(V(p));
  const col = c => c instanceof THREE.Color ? c : new THREE.Color(c.startsWith('--') ? css(c) : c);
  const colStr = c => typeof c === 'string' && !c.startsWith('--') ? c : css(c);
  const UP = new THREE.Vector3(0, 1, 0);
  const b = {
    G, labels, pickables, bb,
    label(text, pos, o = {}) { labels.push({ text, pos: V(pos), cls: o.cls, color: o.color, pin: !!o.pin }); },   // pin = 닻점에 바로 붙임(축 글자). 나머지는 지시선 칩
    lines(pairs, color, { dashed = false, opacity = 1 } = {}) {
      const pts = []; pairs.forEach(([a, c]) => { pts.push(V(a), V(c)); grow(a); grow(c); });
      const m = dashed ? new THREE.LineDashedMaterial({ color: col(color), dashSize: 3.5, gapSize: 2.2, transparent: true, opacity }) : new THREE.LineBasicMaterial({ color: col(color), transparent: opacity < 1, opacity });
      const s = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), m); if (dashed) s.computeLineDistances(); G.add(s); return s;
    },
    arrow(a, c, color, { dashed = false, thick = false, head = null, opacity = 1 } = {}) {
      const A = V(a), Bv = V(c), dir = Bv.clone().sub(A), len = dir.length(); if (len < 1e-6) return; dir.normalize();
      grow(a); grow(c);
      const h = head ?? Math.min(len * 0.28, thick ? 10 : 7), w = thick ? h * 0.5 : h * 0.42, C = col(color);
      const g = new THREE.Group(), end = Bv.clone().sub(dir.clone().multiplyScalar(h));
      if (thick && !dashed) {
        const L = Math.max(0.1, len - h);
        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, L, 8), new THREE.MeshBasicMaterial({ color: C, transparent: opacity < 1, opacity }));
        cyl.position.copy(A).add(dir.clone().multiplyScalar(L / 2)); cyl.quaternion.setFromUnitVectors(UP, dir); g.add(cyl);
      } else {
        const lg = new THREE.BufferGeometry().setFromPoints([A, end]);
        const lm = dashed ? new THREE.LineDashedMaterial({ color: C, dashSize: 4, gapSize: 2.5, transparent: true, opacity }) : new THREE.LineBasicMaterial({ color: C, transparent: opacity < 1, opacity });
        const line = new THREE.Line(lg, lm); if (dashed) line.computeLineDistances(); g.add(line);
      }
      const cone = new THREE.Mesh(new THREE.ConeGeometry(w / 2, h, 12), new THREE.MeshBasicMaterial({ color: C, transparent: opacity < 1, opacity }));
      cone.position.copy(end).add(dir.clone().multiplyScalar(h / 2)); cone.quaternion.setFromUnitVectors(UP, dir); g.add(cone);
      G.add(g); return g;
    },
    dot(p, color, r = 2.6, info = null) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 14), new THREE.MeshBasicMaterial({ color: col(color) }));
      m.position.copy(V(p)); G.add(m); grow(p);
      if (info) { m.userData = { ...info, color: colStr(color) }; pickables.push(m); }
      return m;
    },
    quad(q, color, { opacity = 0.3, dashed = false, info = null } = {}) {
      const P = q.map(V); q.forEach(grow);
      const C = col(color);
      const geo = new THREE.BufferGeometry().setFromPoints(P); geo.setIndex([0, 1, 2, 0, 2, 3]);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: C, side: THREE.DoubleSide, transparent: true, opacity, depthWrite: false }));
      G.add(mesh);
      const loop = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(P), dashed ? new THREE.LineDashedMaterial({ color: C, dashSize: 3.5, gapSize: 2.2 }) : new THREE.LineBasicMaterial({ color: C }));
      if (dashed) loop.computeLineDistances(); G.add(loop);
      if (info) { const center = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(0.25); mesh.userData = { ...info, center, color: colStr(color) }; pickables.push(mesh); }
      return mesh;
    },
    board(q, { opacity = 1, info = null, ghost = false, color = '--anchor' } = {}) {
      if (ghost) return b.quad(q, color, { opacity: 0.08, dashed: true, info });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(q.flat(), 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      geo.setIndex([0, 1, 2, 0, 2, 3]);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: TEX, side: THREE.DoubleSide, transparent: opacity < 1, opacity }));
      G.add(mesh); q.forEach(grow);
      const P = q.map(V);
      if (info) { const center = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(0.25); mesh.userData = { ...info, center, color: css(color) }; pickables.push(mesh); }
      return mesh;
    },
    triad(o, axes, len, names, { cls = 'k' } = {}) {
      const cols = ['#c0392b', '#1e8449', '#1f5fb0'];
      axes.forEach((ax, i) => { const e = add(o, mul(unit(ax), len)); b.arrow(o, e, cols[i], { head: Math.min(5, len * 0.3) }); b.label(names[i], add(o, mul(unit(ax), len * 1.18)), { cls, color: cols[i], pin: true }); });
    },
  };
  return b;
}

/* 지금 단계의 K·왜곡. 4 단계 산출 전에는 첫 추정(K0 · 왜곡 0), 나머지는 실제 보정값 */
const calibModel = st => st.stage === 4 && !st.solvedK ? { K: K0, c: ZERO } : { K: KC, c: COEF };
const poseInfo = p => `자세 ${pad2(p.no)} · 묶음 ${p.group} · 거리 ${fmt(p.dist / 100, 2)} m`;
const pixOf = (p, K = KC, cc = COEF) => { const uv = toPix(p, K, cc); return { uv, d: pxToDisp(uv[0], uv[1]) }; };

function buildScene(st) {
  const b = sceneBuilder(), L = st.layers, m = calibModel(st);
  const corners = [[0, 0], [IMG_W, 0], [IMG_W, IMG_H], [0, IMG_H]].map(p => pxToDisp(p[0], p[1]));
  const ppD = pxToDisp(KC.cx, KC.cy), ctr = pxToDisp(960, 600);
  const poses = POSES.slice(0, st.views);
  const picked = poses[Math.min(st.pick, poses.length) - 1];
  const resid = st.stage === 4 ? picked.corners.map(cn => { const det = pixOf(cn.p), rep = pixOf(cn.p, m.K, m.c); return { cn, det, rep, e: Math.hypot(det.uv[0] - rep.uv[0], det.uv[1] - rep.uv[1]) }; }) : [];
  const rms = resid.length ? Math.sqrt(resid.reduce((s, r) => s + r.e * r.e, 0) / resid.length) : 0;

  /* 광학 중심 C 와 카메라 좌표축(y 는 아래로). 1 단계와 6 단계에서는 촬영 조건 이야기를 한다 */
  const condTip = { name: '촬영 조건', extra: st.stage === 6 ? '보정 당시 초점·줌이 K 파일에 남는다 · 지금 값이 다르면 이 K 는 무효' : '초점·줌을 잠그고 K 파일에 같이 적는다 · 나중에 지금 값이 보정 당시와 다르면 K 무효' };
  b.dot(C0, '--fg', 2.6, st.stage === 1 || st.stage === 6 ? condTip : { name: '광학 중심', extra: '카메라 좌표 원점 · 모든 광선이 지나는 점 · 높이 100 cm 에 둠' });
  b.label(st.stage === 1 ? '촬영 조건 고정' : st.stage === 6 ? '촬영 조건' : '광학 중심', C0, { color: css('--fg'), cls: st.stage === 1 ? '' : 'k' });
  if (L.axes) b.triad(C0, [[1, 0, 0], [0, -1, 0], [0, 0, 1]], 40, ['X', 'Y', 'Z'], { cls: '' });

  /* 이미지 평면 — 센서. C 에서 f 만큼 앞. 시야 사각뿔은 C 에서 네 귀퉁이로. 툴팁은 단계마다 다른 말을 한다 */
  const planeTip = {
    1: { name: '이미지 평면', extra: `${IMG_W}×${IMG_H} px · f 와 주점은 아직 모른다 — 4 단계에서 구한다` },
    2: { name: '이미지 평면', extra: `자세 ${poses.length}장이 덮는 범위 · ${MIN_VIEWS}장 미만이면 풀지 않는다` },
    3: { name: '이미지 평면', extra: `검출된 코너 픽셀이 여기 찍힌다 · 보드 좌표(mm)와 짝을 짓는다` },
    4: st.solvedK ? { name: '이미지 평면 · K 산출 뒤', extra: `잔차 RMS ${fmt(rms, 2)} px (이 자세) · 회차 전체 RMS ${FILE.rms} px` } : { name: '이미지 평면 · K 첫 추정', extra: `잔차 RMS ${fmt(rms, 1)} px (이 자세) · K·왜곡·자세를 같이 고쳐 줄인다` },
    5: { name: '이미지 평면', extra: `검산 묶음의 코너를 빼고 푼 K 로 재투영 · px 오차 → 깊이 ${fmt(DEPTH / 100, 1)} m 에서 cm` },
    6: { name: 'K 파일', extra: `K 4 + 왜곡 계수 5 · 재투영 RMS ${FILE.rms} px · 사진 ${FILE.views}장 · 가로 화각 ${FILE.hfov}° · 위치 보정의 PnP 와 측정의 undistortPoints 가 쓴다` },
  }[st.stage];
  b.quad(corners, '--plane', { opacity: 0.12, info: planeTip });
  b.label(st.stage === 6 ? 'K 파일' : '이미지 평면', mul(add(corners[0], corners[1]), 0.5), { color: css('--plane'), cls: st.stage === 6 ? '' : 'k' });
  if (L.fov) b.lines(corners.map(k => [C0, k]), '--muted', { opacity: 0.5 });

  /* 광축: C → 주점(실선) → 멀리(점선) */
  b.lines([[C0, ppD]], '--plane');
  b.lines([[ppD, camToDisp(0, 0, 330)]], '--plane', { dashed: true, opacity: 0.5 });

  /* 이미지 평면 위 격자 — 사진은 왜곡된 채 찍히므로 늘 휘어 있다. 4 단계 산출 전(첫 추정 = 왜곡 0)만 곧다 */
  if (L.grid) {
    const N = 40, pairs = [];
    const poly = pts => { for (let i = 1; i < pts.length; i++) pairs.push([pts[i - 1], pts[i]]); };
    for (let u = 0; u <= IMG_W; u += 120) poly(Array.from({ length: N + 1 }, (_, i) => { const d = distortedPx(u, IMG_H * i / N, KC, m.c); return pxToDisp(d[0], d[1]); }));
    for (let v = 0; v <= IMG_H; v += 120) poly(Array.from({ length: N + 1 }, (_, i) => { const d = distortedPx(IMG_W * i / N, v, KC, m.c); return pxToDisp(d[0], d[1]); }));
    b.lines(pairs, '--gridline', { opacity: 0.4 });
  }

  /* 2 촬영: 보드를 시야 안 여러 자리·기울기로 찍는다 */
  if (st.stage === 2) {
    poses.forEach(p => b.board(p.quad, { opacity: 0.55, info: { name: '촬영 자세', extra: poseInfo(p) } }));
    b.label('보드 자세', poses[0].center, { color: css('--anchor') });
  }

  /* 3 코너 검출: 사진마다 체스판 안쪽 코너 15개를 찾고 보드 좌표(mm)와 짝 짓는다. 6개 미만이면 그 사진은 버린다 */
  if (st.stage === 3 || st.stage === 4) {
    poses.forEach(p => { if (p !== picked) b.board(p.quad, { ghost: true, color: '--grid' }); });
    b.board(picked.quad, { opacity: 0.6, info: { name: '촬영 자세', extra: `${poseInfo(picked)} · 코너 ${picked.corners.length} (${MIN_CORNERS} 미만이면 버린다)` } });
    b.label('자세', picked.center, { color: css('--anchor') });
    const mid = picked.corners[7];                                                 // (2, 3) — 가운데 코너에 칩을 단다
    picked.corners.forEach(cn => {
      b.dot(cn.p, '--pt', 1.1, { name: '보드 코너', extra: `(${cn.i}, ${cn.j}) · 보드 좌표 (${cn.i * 90}, ${cn.j * 90}, 0) mm` });
      if (L.rays) b.lines([[cn.p, C0]], '--pt', { opacity: 0.3 });
    });
    b.label('보드 코너', mid.p, { color: css('--pt'), cls: 'k' });
    if (st.stage === 3) {
      picked.corners.forEach(cn => { const q = pixOf(cn.p); b.dot(q.d, '--pt', 1.3, { name: '검출 픽셀', extra: `(${cn.i}, ${cn.j}) · (${fmt(q.uv[0], 1)}, ${fmt(q.uv[1], 1)}) px` }); });
      b.label('검출 픽셀', pixOf(mid.p).d, { color: css('--pt') });
    }
  }

  /* 4 K 산출: 검출 픽셀(주황)과 지금 K·왜곡으로 되돌려 찍은 재투영(회색)의 차이를 줄인다. 첫 추정은 왜곡 0 · 주점 = 가운데.
     산출 뒤에는 구한 K 가 보인다 — 초점거리·주점·휜 격자 */
  if (st.stage === 4) {
    resid.forEach(({ cn, det, rep, e }) => {
      b.dot(det.d, '--pt', 1.3, { name: '검출 픽셀', extra: `(${cn.i}, ${cn.j}) · (${fmt(det.uv[0], 1)}, ${fmt(det.uv[1], 1)}) px` });
      b.dot(rep.d, '--ideal', 1.2, { name: '재투영', extra: `(${cn.i}, ${cn.j}) · 잔차 ${fmt(e, 2)} px · ${st.solvedK ? '산출 뒤' : '첫 추정 (왜곡 0 · 주점 = 이미지 가운데)'}` });
      if (!st.solvedK) b.lines([[det.d, rep.d]], '--pt', { opacity: 0.9 });
    });
    const r7 = resid[7];
    b.label('검출 픽셀', r7.det.d, { color: css('--pt') });
    b.label('재투영', r7.rep.d, { color: css('--ideal'), cls: 'k' });
  }

  /* 5 hold-out 검산: 묶음 하나를 빼고 푼 K 로 그 묶음을 재투영해 오차를 잰다. 묶음은 6(자리 3 × 좌우 2) */
  if (st.stage === 5) {
    let firstTrain = null, firstTest = null;
    const nTrain = poses.filter(p => p.group !== st.hold).length;
    poses.forEach(p => {
      if (p.group === st.hold) {
        b.quad(p.quad, '--est', { opacity: 0.06, dashed: true, info: { name: '검산 묶음', extra: `${poseInfo(p)} · 빼고 푼 K 로 재투영해 오차를 잰다` } });
        p.corners.forEach(cn => b.dot(pixOf(cn.p).d, '--est', 1.0));
        firstTest = firstTest || p;
      } else {
        b.quad(p.quad, '--anchor', { opacity: 0.22, info: { name: '학습 묶음', extra: `${poseInfo(p)} · K 를 푸는 데 쓴다 (남은 ${nTrain}장 · ${MIN_VIEWS}장 이상이어야 잰다)` } });
        firstTrain = firstTrain || p;
      }
    });
    if (firstTrain) b.label('학습 묶음', firstTrain.center, { color: css('--anchor'), cls: 'k' });
    if (firstTest) b.label('검산 묶음', firstTest.center, { color: css('--est') });
    /* 사람이 서는 깊이 — 광축 위 Z = 2.2 m. px 오차 하나가 이 깊이에서 Z/fx 만큼이라 cm 로 바꿀 때 쓴다 */
    const dp = camToDisp(0, 0, DEPTH), depthName = `깊이 ${fmt(DEPTH / 100, 1)} m`;
    b.dot(dp, '--ok', 2.2, { name: depthName, extra: '사람이 서는 깊이 · hold-out 의 px 오차를 이 깊이에서의 cm 로 바꾼다' });
    b.label(depthName, dp, { color: css('--ok'), cls: 'k' });
  }

  /* 산출 뒤(4)·K 파일(6): 구한 K 를 그림으로 — 초점거리 f, 주점, 이미지 가운데와의 차이 */
  if ((st.stage === 4 && st.solvedK) || st.stage === 6) {
    b.arrow(C0, ppD, '--plane', { thick: true });
    b.label('초점거리', mul(add(C0, ppD), 0.5), { color: css('--plane') });
    b.dot(ppD, '--pp', 2.2, { name: '주점', extra: `광축이 이미지 평면과 만나는 픽셀 · (${fmt(KC.cx, 2)}, ${fmt(KC.cy, 2)}) px` });
    b.label('주점', ppD, { color: css('--pp') });
    const cs = 5;
    b.lines([[[ctr[0] - cs, ctr[1], ctr[2]], [ctr[0] + cs, ctr[1], ctr[2]]], [[ctr[0], ctr[1] - cs, ctr[2]], [ctr[0], ctr[1] + cs, ctr[2]]]], '--ideal', { opacity: 0.9 });
    b.dot(ctr, '--ideal', 1.5, { name: '이미지 가운데', extra: '(960, 600) px' });
    b.label('이미지 가운데', ctr, { color: css('--ideal'), cls: 'k' });
    b.lines([[ppD, ctr]], '--pp');
  }
  if (st.stage === 6) {
    const gc = pxToDisp(IMG_W - 60, 60);                                           // 오른쪽 위 귀퉁이 근처 — 왜곡이 가장 큰 곳
    b.dot(gc, '--gridline', 1.4, { name: '왜곡 계수', extra: `k1 ${CALIB.k1} · k2 ${CALIB.k2} · k3 ${CALIB.k3} · p1 ${CALIB.p1} · p2 ${CALIB.p2} · 귀퉁이에서 약 100 px 안쪽으로 당겨지는 통 모양` });
    b.label('왜곡 계수', gc, { color: css('--gridline'), cls: 'k' });
  }
  return { group: b.G, labels: b.labels, pickables: b.pickables, bbox: b.bb, range: RANGE, step: STEP };
}

/* ═══════════════════ 카메라가 보는 이미지(2D) ═══════════════════ */
function drawInset(st) {
  const cvs = $('#imgview'), w = cvs.clientWidth; if (!w || !st.layers.inset) return;
  const h = w * IMG_H / IMG_W, dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (cvs.width !== Math.round(w * dpr) || cvs.height !== Math.round(h * dpr)) { cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr); }
  const ctx = cvs.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const m = calibModel(st), k = w / IMG_W;
  ctx.fillStyle = css('--pane'); ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  if (st.layers.grid) {
    ctx.strokeStyle = css('--gridline'); ctx.globalAlpha = 0.4; ctx.lineWidth = 1; ctx.beginPath();
    const N = 40;
    for (let u = 0; u <= IMG_W; u += 120) for (let i = 0; i <= N; i++) { const d = distortedPx(u, IMG_H * i / N, KC, m.c); i ? ctx.lineTo(d[0] * k, d[1] * k) : ctx.moveTo(d[0] * k, d[1] * k); }
    for (let v = 0; v <= IMG_H; v += 120) for (let i = 0; i <= N; i++) { const d = distortedPx(IMG_W * i / N, v, KC, m.c); i ? ctx.lineTo(d[0] * k, d[1] * k) : ctx.moveTo(d[0] * k, d[1] * k); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  const dotAt = (u, v, r, color, hollow = false) => { ctx.beginPath(); ctx.arc(u * k, v * k, r, 0, Math.PI * 2); if (hollow) { ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.stroke(); } else { ctx.fillStyle = color; ctx.fill(); } };
  const poses = POSES.slice(0, st.views), picked = poses[Math.min(st.pick, poses.length) - 1];
  const outline = (p, color, dashed = false, width = 1) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dashed ? [3, 3] : []); ctx.beginPath();
    for (let e = 0; e < 4; e++) { const a = p.quad[e], bq = p.quad[(e + 1) % 4]; for (let i = 0; i <= 8; i++) { const q = toPix(add(a, mul(sub(bq, a), i / 8)), KC, COEF); (e === 0 && i === 0) ? ctx.moveTo(q[0] * k, q[1] * k) : ctx.lineTo(q[0] * k, q[1] * k); } }
    ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  };
  if (st.stage === 2) poses.forEach(p => outline(p, css('--anchor')));
  if (st.stage === 3 || st.stage === 4) {
    poses.forEach(p => { if (p !== picked) outline(p, css('--grid'), true); });
    outline(picked, css('--anchor'), false, 1.2);
    picked.corners.forEach(cn => {
      const det = toPix(cn.p, KC, COEF);
      if (st.stage === 4) { const rep = toPix(cn.p, m.K, m.c); ctx.strokeStyle = css('--pt'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(det[0] * k, det[1] * k); ctx.lineTo(rep[0] * k, rep[1] * k); ctx.stroke(); dotAt(rep[0], rep[1], 2.6, css('--ideal'), true); }
      dotAt(det[0], det[1], 2.2, css('--pt'));
    });
  }
  if (st.stage === 5) poses.forEach(p => outline(p, p.group === st.hold ? css('--est') : css('--anchor'), p.group === st.hold, p.group === st.hold ? 1.2 : 1));
  if ((st.stage === 4 && st.solvedK) || st.stage === 6) {
    ctx.strokeStyle = css('--ideal'); ctx.lineWidth = 1.2; ctx.beginPath();
    ctx.moveTo(960 * k - 6, 600 * k); ctx.lineTo(960 * k + 6, 600 * k); ctx.moveTo(960 * k, 600 * k - 6); ctx.lineTo(960 * k, 600 * k + 6); ctx.stroke();
    ctx.strokeStyle = css('--pp'); ctx.beginPath(); ctx.moveTo(960 * k, 600 * k); ctx.lineTo(KC.cx * k, KC.cy * k); ctx.stroke();
    dotAt(KC.cx, KC.cy, 3, css('--pp'));
  }
  ctx.restore();
}

/* ═══════════════════ 조작 — 단계 탭뿐 ═══════════════════ */
function renderControls() {
  $('#inset').hidden = !state.layers.inset;
  document.body.classList.toggle('has-inset', state.layers.inset);
}

/* ═══════════════════ 조립 ═══════════════════ */
const host = $('#v3d'), toolbarEl = $('#toolbar'), insetEl = $('#inset');
let viewer;
try { viewer = createViewer(host, { reserve: () => ({ L: toolbarEl.offsetHeight + 8, R: insetEl.offsetHeight ? insetEl.offsetHeight + 8 : 0 }) }); }
catch (e) { host.innerHTML = `<div class="err">3D 를 열 수 없습니다 · ${e && e.message || e}</div>`; }
function refresh() {
  renderControls();
  if (viewer) viewer.setScene(buildScene(state));
  drawInset(state);
}

$('#tabs').addEventListener('click', e => {
  const bt = e.target.closest('button[data-stage]'); if (!bt) return;
  state.stage = +bt.dataset.stage;
  $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === bt)));
  refresh();
});
$('#views').addEventListener('click', e => {
  const bt = e.target.closest('button[data-view]'); if (!bt) return;
  state.view = bt.dataset.view;
  $('#views').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === bt)));
  viewer && viewer.setView(state.view);
});
['axes', 'fov', 'grid', 'rays', 'inset'].forEach(k => $('#ly-' + k).addEventListener('change', e => { state.layers[k] = e.target.checked; refresh(); }));
new ResizeObserver(() => { drawInset(state); viewer && viewer.redraw(); }).observe(insetEl);

const applyHash = () => { if (!/^#s[1-6]$/.test(location.hash)) return; state.stage = +location.hash[2]; $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(+x.dataset.stage === state.stage))); };
applyHash();
addEventListener('hashchange', () => { applyHash(); refresh(); });
refresh();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => refresh());

/* 끼워 넣기: 여섯 단계를 차례로(4 단계는 K 첫 추정과 산출 뒤 두 번), 단계마다 자막 한 줄. 끝나면 처음부터, 화면 밖에서는 멈춘다 */
if (EMBED) {
  const SEQ = [
    { stage: 1, dur: 6, cap: '촬영 조건을 먼저 잠급니다. 초점과 줌이 보정 뒤에 달라지면 그 K 는 무효가 됩니다.' },
    { stage: 2, dur: 6, cap: `보드를 자세 ${N_VIEWS}가지로 찍습니다. 보드가 이미지 평면을 고루 덮어야 하고, ${MIN_VIEWS}장보다 적으면 풀지 않습니다.` },
    { stage: 3, dur: 6, cap: '사진마다 보드의 코너를 검출합니다. 코너 픽셀 하나가 보드 좌표 하나와 짝이 됩니다.' },
    { stage: 4, dur: 5, solvedK: false, cap: '짝에서 K 를 처음 추정합니다. 보드 점을 다시 투영하면 검출 픽셀과 어긋나는 잔차가 보입니다.' },
    { stage: 4, dur: 6, solvedK: true, cap: 'K 와 왜곡 계수와 자세를 같이 고쳐 잔차를 줄입니다. 이 회차의 재투영 RMS 는 ' + FILE.rms + ' px 입니다.' },
    { stage: 5, dur: 6, cap: '풀 때 뺀 묶음의 코너로 검산합니다. 픽셀 오차를 사람이 서는 깊이 ' + (DEPTH / 100).toFixed(1) + ' m 에서의 cm 로 바꿔 봅니다.' },
    { stage: 6, dur: 6, cap: 'K 4개와 왜곡 계수 5개를 파일로 적습니다. 위치 보정과 측정이 이 파일을 읽습니다.' },
  ];
  const player = $('#player'), capEl = $('#cap'), fill = $('#fill');
  let k = 0, t = 0, last = 0, raf = 0, on = true;
  const show = () => { const s = SEQ[k]; state.stage = s.stage; state.solvedK = !!s.solvedK; capEl.textContent = s.cap; refresh(); };
  const tick = now => {
    raf = 0;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    t += dt;
    if (t >= SEQ[k].dur) { t = 0; k = (k + 1) % SEQ.length; show(); }
    fill.style.width = ((k + t / SEQ[k].dur) / SEQ.length * 100).toFixed(2) + '%';
    if (on) raf = requestAnimationFrame(tick);
  };
  const run = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };
  player.hidden = false; show(); run();
  /* 화면 밖이거나 끼워 넣는 쪽(viewer-tabs.js)이 탭 뒤에 숨겼을 때 멈춘다 */
  let held = false, seen = true;
  const sync = () => { on = seen && !held; if (on) run(); };
  addEventListener('message', e => { const m = e.data; if (!m || !m.hw) return; if (m.hw === 'pause' || m.hw === 'resume') { held = m.hw === 'pause'; sync(); } });
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { seen = es.some(e => e.isIntersecting); sync(); }, { threshold: 0.05 }).observe(document.body);
}
</script>

</body></html>
