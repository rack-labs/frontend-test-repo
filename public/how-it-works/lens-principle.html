<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>렌즈 보정 산출 원리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 「위치 보정 산출 원리」와 같다. 3D 뷰(격벽 뷰어)가 화면 전체, 단계 탭과 시점 버튼은 위, 재생기(자막·진행 막대·버튼)는 아래 가운데.
   카메라가 보는 이미지는 오른쪽 위 작은 창. 밝은 테마 하나로 고정한다 */
:root{
  --bg:#e9edf2; --panel:#ffffff; --pane:#f2f5f8; --grid:#c9d2db; --edge:#aeb9c4;
  --fg:#1b1f27; --muted:#5b6270; --line:#d5dce4; --accent:#1f5fb0; --spike:#1b1f27;
  --plane:#2E7DD1; --pp:#a8307f; --pt:#d2571f; --ideal:#7a838f; --gridline:#3a4150; --anchor:#c99400; --est:#2E7DD1; --ok:#1f8a5b;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;padding:0;background:var(--panel);color:var(--fg);font:14px/1.5 var(--font);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{position:fixed;inset:0}
.v3d{position:absolute;inset:0;background:var(--panel);overflow:hidden;touch-action:none}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov .tick{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 10.5px/1 var(--mono);color:var(--muted);will-change:transform}
.ov .ttl{font-weight:700;color:var(--fg)}
.ov .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:600 11px/1.2 var(--mono);padding:2px 4px;color:var(--fg);will-change:transform,opacity}
.ov .lbl.k{font-weight:500;color:var(--muted)}
.ov .lead{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ov .lead line{stroke-width:1.2;opacity:.8}
.ov .lead circle{opacity:.9}
.ov .tip{position:absolute;left:0;top:0;display:none;z-index:3;padding:6px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 11px/1.45 var(--mono);white-space:nowrap}
.ov .tip div+div{color:var(--muted);font-weight:500}

/* 위: 단계 탭(왼쪽) · 시점(오른쪽). 좁으면 두 줄로 */
.top{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top,0px));left:0;right:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);font-weight:500;font-size:13px;display:flex;gap:7px;align-items:center}
.tabs button b{font:600 11px/1 var(--mono);color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs button[aria-selected="true"] b{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.seg button{padding:6px 11px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[disabled]{opacity:.45;cursor:default}

/* 오른쪽 위: 카메라가 보는 이미지. 시점 버튼 아래. 좁은 화면에서는 숨긴다 */
.inset{position:absolute;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 46px);
  width:min(260px,28vw);aspect-ratio:1920/1200;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--pane)}
.inset canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.inset .tag{position:absolute;left:7px;top:5px;font:600 10.5px/1 var(--mono);color:var(--muted);pointer-events:none}
@media (max-width:640px){ .inset{display:none} }

/* 아래: 재생기 */
.player{position:absolute;z-index:5;left:0;right:0;bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;pointer-events:none}
.card{pointer-events:auto;width:min(760px,100%);min-width:0;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px 12px;display:grid;gap:8px;box-shadow:0 2px 12px rgba(27,31,39,.10)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:600 11px/1 var(--mono);color:var(--muted)}
.meta .file{padding:3px 6px;border-radius:4px;background:var(--pane);color:var(--fg);font-weight:500}
.meta .hint{margin-left:auto;font-weight:500}
.cap{font-size:14px;line-height:1.5;min-height:3em;text-wrap:pretty;max-width:62ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.ctl button{padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.ctl button:last-child{border-right:0}
.ctl button[disabled]{opacity:.4;cursor:default}
.ctl .play{min-width:78px;font-weight:600;background:var(--accent);color:#fff}
.bar{flex:1;min-width:180px;display:flex;gap:7px;height:14px;align-items:stretch}
.bar .st{display:flex;gap:2px;flex:var(--w) 1 0;min-width:0}
.bar .sg{flex:var(--d) 1 0;min-width:4px;padding:0;background:var(--line);border-radius:2px;position:relative;overflow:hidden;display:block}
.bar .sg i{position:absolute;inset:0;width:0;background:var(--accent);display:block}
.bar .sg[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--accent)}

/* 영상 저장용(?video=1): 단계 탭·시점·진행 막대·버튼·안내를 다 숨기고 자막 카드와 이미지 창만 남긴다 */
body.video .top,body.video .row,body.video .hint{display:none}
body.video .v3d{bottom:124px}
body.video .inset{top:12px;right:12px}
body.video .card{background:none;border:0;box-shadow:none;width:min(1100px,100%);padding:0 0 14px;gap:8px;justify-items:center;text-align:center}
body.video .meta{font-size:13px;justify-content:center}
body.video .meta .file{background:none;padding:0;color:var(--muted)}
body.video .cap{font-size:20px;line-height:1.55;min-height:0;max-width:none;text-align:center;text-wrap:balance}
/* 사이트 끼워 넣기용(?embed=1&bg=eceef1): 탭·시점·단계 이름·버튼·안내를 숨기고, 얇은 진행 막대 하나와 상자 없는 자막만 남긴다.
   바탕은 ?bg= 로 받아 섹션과 같은 색으로 그린다. 끝나면 처음부터 다시 돌고, 화면 밖에 있는 동안은 멈춘다 */
body.embed{background:var(--bg)}
body.embed .v3d{background:transparent;bottom:92px}
body.embed .top,body.embed .meta,body.embed .ctl{display:none}
body.embed .inset{top:12px;right:12px}
body.embed .player{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
body.embed .card{background:none;border:0;box-shadow:none;width:min(820px,100%);padding:0;gap:10px;justify-items:center;text-align:center}
body.embed .cap{display:grid;align-content:end;font-size:1.125rem;word-break:keep-all;line-height:1.5;min-height:3em;max-width:none;text-align:center;text-wrap:balance}
body.embed .row{width:100%}
body.embed .bar{gap:0;height:3px;min-width:0;border-radius:2px;overflow:hidden;background:color-mix(in srgb,var(--fg) 12%,transparent)}
body.embed .bar .st{gap:0}
body.embed .bar .sg{min-width:0;border-radius:0;background:transparent}
body.embed .bar .sg[aria-current="true"]{box-shadow:none}
@media (max-width:560px){ body.embed .v3d{bottom:112px} body.embed .cap{min-height:4.5em} }
.err{display:flex;align-items:center;justify-content:center;height:100%;font:600 12px/1.4 var(--mono);color:var(--muted);padding:16px;text-align:center}
</style>

<main class="wrap">
  <div class="v3d" id="v3d"></div>
  <div class="top">

  <div class="player">

        </div>
        <div class="bar" id="bar" aria-label="진행"></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
let THREE;
try { THREE = await import('/vendor/three/three.module.min.js'); }
catch (_) { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'); }

/* ═══════════════════ 굵은 선 ═══════════════════
   WebGL 의 선은 늘 1 장치 픽셀이라 고해상도 화면·캡처에서 머리카락처럼 가늘어진다. 선분 하나를 가는 원기둥 하나로 그리고
   한 묶음을 InstancedMesh 하나에 담는다(굵기 r 은 cm). 점선은 대시마다 원기둥 하나 */
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true); UNIT_CYL.userData.keep = true;
const UP_Y = new THREE.Vector3(0, 1, 0);
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _d = new THREE.Vector3();
class Segs {
  constructor(parent, color, { opacity = 1, r = 0.4, dashed = false, dash = 3.5, gap = 2.2 } = {}) {
    this.r = r; this.dashed = dashed; this.dash = dash; this.gap = gap; this.cap = 0; this.mesh = null;
    this.mat = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity });
    this.g = new THREE.Group(); parent.add(this.g);
  }
  ensure(n) {
    if (this.mesh && n <= this.cap) return;
    if (this.mesh) { this.g.remove(this.mesh); this.mesh.dispose(); }
    this.cap = Math.max(8, Math.ceil(n * 1.25));
    this.mesh = new THREE.InstancedMesh(UNIT_CYL, this.mat, this.cap); this.mesh.frustumCulled = false; this.g.add(this.mesh);
  }
  update(pairs) {
    const segs = [];
    for (const [a, b] of pairs) {
      if (!this.dashed) { segs.push(a, b); continue; }
      _d.subVectors(b, a); const L = _d.length(); if (L < 1e-6) continue; _d.divideScalar(L);
      for (let s = 0; s < L; s += this.dash + this.gap) { const e = Math.min(L, s + this.dash); segs.push(a.clone().addScaledVector(_d, s), a.clone().addScaledVector(_d, e)); }
    }
    const n = segs.length / 2; this.ensure(n);
    for (let i = 0; i < n; i++) {
      const a = segs[2 * i], b = segs[2 * i + 1];
      _d.subVectors(b, a); const L = _d.length();
      if (L < 1e-6) { _s.set(0, 0, 0); _q.identity(); } else { _d.divideScalar(L); _q.setFromUnitVectors(UP_Y, _d); _s.set(this.r, L, this.r); }
      _p.addVectors(a, b).multiplyScalar(0.5); _m4.compose(_p, _q, _s); this.mesh.setMatrixAt(i, _m4);
    }
    this.mesh.count = n; this.mesh.instanceMatrix.needsUpdate = true;
    return this;
  }
}
const toPairs = flat => { const o = []; for (let i = 0; i + 1 < flat.length; i += 2) o.push([flat[i], flat[i + 1]]); return o; };
const disposeTree = root => root.traverse(o => { if (o.isInstancedMesh) o.dispose(); if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose(); if (o.material) o.material.dispose(); });

/* ═══════════════════ 데이터 (정지 장면 「렌즈 내재변수 3D」와 같다) ═══════════════════
   C1 의 렌즈 보정값(OpenCV calibrateCamera, flag 없음). 1920×1200 px · 사진 114장 · 재투영 RMS 0.449 px · 가로 화각 103.68°.
   장면 비율 1 px = 0.1 cm. 광학 중심 C 는 높이 100 cm, 격벽의 x·z·높이 축은 카메라 좌표 X·Z·(100 − Y).
   보드 자세는 결정적 난수로 만든 예시(열 장)이고, 검출 픽셀은 그 자세를 실제 보정값으로 투영한 것이다.
   문턱값은 backend/service/calibration 의 상수: 뷰 8장 이상 · 뷰당 코너 6 이상 · hold-out 묶음 6(자리 3 × 좌우 2) · 사람이 서는 깊이 2.2 m */
const CALIB = { fx: 754.39, fy: 754.07, cx: 958.39, cy: 589.31, k1: 0.02881, k2: -0.07958, k3: 0.01993, p1: 0.000553, p2: -0.001256 };
const FILE = { rms: 0.449, views: 114, hfov: 103.68, name: 'K_00D6_runNN.json' };
const IMG_W = 1920, IMG_H = 1200;
const PX = 0.1, H0 = 100;
const RANGE = { x: [-150, 150], y: [0, 250], z: [-50, 350] }, STEP = 50;
const BOARD = { W: 36, H: 54, sq: 9 };
const N_MAX = 24, N_VIEWS = 10, N_GROUPS = 6, MIN_VIEWS = 8, MIN_CORNERS = 6, DEPTH = 220, HOLD_G = 2;
const JOINT_PX = [1700, 230];                                                   // 6 단계 쓰임: 관절 픽셀 예시(귀퉁이 쪽 — 왜곡 제거가 보이는 자리)

/* ── 작은 수학 ── */
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const nrm = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => mul(a, 1 / (nrm(a) || 1));
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const fmt = (v, n = 1) => { const s = (Math.round(Math.abs(v) * 10 ** n) / 10 ** n).toFixed(n); return (v < 0 && s !== (0).toFixed(n) ? '−' : '') + s; };
const pad2 = n => String(n).padStart(2, '0');
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut = k => 1 - (1 - k) ** 3;
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
const prog = (t, r) => clamp01((t - r[0]) / Math.max(r[1], 1e-3));

/* ── 핀홀 + 왜곡 모델(OpenCV 식: 나누기 → 왜곡 → K). 보정은 이 식의 빈칸 9개를 채우는 일이다 ── */
const distort = (xp, yp, c) => {
  const r2 = xp * xp + yp * yp, r4 = r2 * r2, r6 = r4 * r2;
  const rad = 1 + c.k1 * r2 + c.k2 * r4 + c.k3 * r6;
  return [xp * rad + 2 * c.p1 * xp * yp + c.p2 * (r2 + 2 * xp * xp), yp * rad + c.p1 * (r2 + 2 * yp * yp) + 2 * c.p2 * xp * yp];
};
/* 거꾸로: 왜곡된 정규화 좌표 → 왜곡 전(undistortPoints 가 하는 반복 풀이) */
const undistort = (xd, yd, c) => {
  let x = xd, y = yd;
  for (let i = 0; i < 10; i++) {
    const r2 = x * x + y * y, r4 = r2 * r2, r6 = r4 * r2, rad = 1 + c.k1 * r2 + c.k2 * r4 + c.k3 * r6;
    const dx = 2 * c.p1 * x * y + c.p2 * (r2 + 2 * x * x), dy = c.p1 * (r2 + 2 * y * y) + 2 * c.p2 * x * y;
    x = (xd - dx) / rad; y = (yd - dy) / rad;
  }
  return [x, y];
};
const ZERO = { k1: 0, k2: 0, k3: 0, p1: 0, p2: 0 };
const COEF = { k1: CALIB.k1, k2: CALIB.k2, k3: CALIB.k3, p1: CALIB.p1, p2: CALIB.p2 };
const KC = { fx: CALIB.fx, fy: CALIB.fy, cx: CALIB.cx, cy: CALIB.cy };
/* calibrateCamera 의 첫 추정: 왜곡 0, fx·fy 는 호모그래피에서(여기서는 8% 크게 잡힌 예시), 주점은 이미지 가운데 */
const K0 = { fx: CALIB.fx * 1.08, fy: CALIB.fy * 1.08, cx: 960, cy: 600 };
const INIT = { K: K0, c: ZERO }, REAL = { K: KC, c: COEF };
const lerpK = (a, b, k) => ({ fx: lerp(a.fx, b.fx, k), fy: lerp(a.fy, b.fy, k), cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k) });
const lerpC = (a, b, k) => ({ k1: lerp(a.k1, b.k1, k), k2: lerp(a.k2, b.k2, k), k3: lerp(a.k3, b.k3, k), p1: lerp(a.p1, b.p1, k), p2: lerp(a.p2, b.p2, k) });

  let drag = null, pinch = null, tap = null;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
  const setRadius = r => { const span = W ? Math.max(W.R.x[1] - W.R.x[0], W.R.y[1] - W.R.y[0], W.R.z[1] - W.R.z[0]) : 300; radius = Math.min(span * 6, Math.max(span * 0.45, r)); userZoomed = true; };
  el.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* 합성 이벤트 */ }
    if (pts.size === 1) { drag = [e.clientX, e.clientY]; pinch = null; tap = [e.clientX, e.clientY]; }
    else if (pts.size === 2) { drag = null; tap = null; pinch = { d0: dist(), r0: radius }; }
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) {
      if (e.buttons === 0 && pts.size === 0) { const hit = pickAt(e.clientX, e.clientY, e.pointerType !== 'mouse'); if (hit) { showPick(hit); draw(); } else if (picked && !picked.sticky) { showPick(null); draw(); } }
      return;
    }
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && pts.size >= 2) { const d = dist(); if (d > 0) { setRadius(pinch.r0 * pinch.d0 / d); W && W.apply(); draw(); } return; }
    if (!drag) return;
    if (tap && Math.hypot(e.clientX - tap[0], e.clientY - tap[1]) > 8) tap = null;
    tween = null;
    theta -= (e.clientX - drag[0]) * 0.006;
    phi = Math.min(1.52, Math.max(0.05, phi - (e.clientY - drag[1]) * 0.006));
    drag = [e.clientX, e.clientY]; W && W.apply(); draw();
  });
  const lift = e => {
    const wasTap = tap && pts.size === 1 && pts.has(e.pointerId);
    pts.delete(e.pointerId); pinch = null;
    drag = pts.size === 1 ? [...pts.values()][0].slice() : null;
    if (wasTap) { const hit = pickAt(e.clientX, e.clientY, e.pointerType !== 'mouse'); if (hit) hit.sticky = true; showPick(hit); draw(); }
    tap = null;
  };
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, lift));
  el.addEventListener('pointerleave', e => { if (e.buttons === 0 && pts.size === 0 && picked && !picked.sticky) { showPick(null); draw(); } });
  el.addEventListener('wheel', e => { e.preventDefault(); setRadius(radius * (1 + e.deltaY * 0.001)); W && W.apply(); draw(); }, { passive: false });

  const fit = () => {
    const r = host.getBoundingClientRect();
    if (r.width < 4 || r.height < 4) return;
    renderer.setSize(r.width, r.height, false);
    cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
    if (!W) return;
    if (!userZoomed && needFit) { radius = W.fitRadius(cam.aspect); needFit = false; }
    W.apply(); draw();
  };
  new ResizeObserver(() => { needFit = true; fit(); }).observe(host);

  return {
    setView(name) { const v = VIEWS[name] || VIEWS.free; tween = null; theta = v[0]; phi = v[1]; userZoomed = false; needFit = true; fit(); },
    tweenView(th, ph, dur, startAt = performance.now()) {
      if (dur <= 0) { tween = null; theta = th; phi = ph; W && W.apply(); return; }
      let d = th - theta; d = Math.atan2(Math.sin(d), Math.cos(d));
      tween = { th0: theta, dth: d, ph0: phi, dph: ph - phi, start: startAt, dur: dur * 1000 };
    },
    busy() { return !!tween; },
    frame(t, now) {
      if (tween) {
        const k = clamp01((now - tween.start) / tween.dur), e = easeInOut(k);
        theta = tween.th0 + tween.dth * e; phi = tween.ph0 + tween.dph * e;
        if (k >= 1) tween = null;
        W && W.apply();
      }
      if (S) S.anims.forEach(a => a(t));
      labelEls.forEach(it => {
        if (!it.reveal) return;
        const k = prog(t, it.reveal);
        if (k !== it.k) { it.k = k; it.el.style.opacity = k; if (it.line) { it.line.style.opacity = k * 0.8; it.dot.style.opacity = k * 0.9; } }
      });
      draw();
    },
    setScene(Sn) {
      const keep = picked ? { name: picked.name, sticky: picked.sticky } : null;
      if (S) { scene.remove(S.group); disposeTree(S.group); }
      labelEls.splice(0).forEach(l => { l.el.remove(); if (l.line) { l.line.remove(); l.dot.remove(); } });
      S = Sn; scene.add(S.group);
      S.labels.forEach(l => {
        const d = document.createElement('div'); d.className = 'lbl' + (l.cls ? ' ' + l.cls : ''); d.innerHTML = l.text; if (l.color) d.style.color = l.color; overlay.appendChild(d);
        const it = { el: d, pos: l.pos, pin: !!l.pin, w: d.offsetWidth, h: d.offsetHeight, line: null, dot: null, reveal: l.reveal || null, k: l.reveal ? 0 : 1 };
        if (it.reveal) d.style.opacity = '0';
        if (!it.pin) {
          const stroke = l.color || css('--muted');
          it.line = document.createElementNS(SVG_NS, 'line'); it.line.setAttribute('stroke', stroke); lead.appendChild(it.line);
          it.dot = document.createElementNS(SVG_NS, 'circle'); it.dot.setAttribute('r', '2'); it.dot.setAttribute('fill', stroke); lead.appendChild(it.dot);
          if (it.reveal) { it.line.style.opacity = 0; it.dot.style.opacity = 0; }
        }
        labelEls.push(it);
      });
      /* 격벽 범위: 장면이 주면 그대로(이 페이지는 고정 — 비트가 바뀌어도 눈금이 안 튄다), 없으면 bbox 에서 */
      let R, step;
      if (Sn.range) { R = Sn.range; step = Sn.step || pickStep(Math.max(R.x[1] - R.x[0], R.y[1] - R.y[0], R.z[1] - R.z[0])); }
      else {
        const bb = S.bbox, span = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z, 40);
        step = pickStep(span * 1.16); const pad = span * 0.08;
        const lo = v => Math.floor((v - pad) / step) * step, hi = v => Math.ceil((v + pad) / step) * step;
        R = { x: [lo(bb.min.x), hi(bb.max.x)], y: [bb.min.y >= -pad ? 0 : lo(bb.min.y), hi(bb.max.y)], z: [lo(bb.min.z), hi(bb.max.z)] };
      }
      const key = ['x', 'y', 'z'].map(a => R[a].join(':')).join('|');
      if (!W || W.key !== key) { buildWalls(R, step); needFit = true; }
      picked = null; tip.style.display = 'none'; W.spike.visible = W.marker.visible = false;
      if (keep) { const o = S.pickables.find(p => p.userData.name === keep.name); if (o) { const u = o.userData; showPick({ p: u.center ? u.center.clone() : o.position.clone(), name: u.name, extra: u.extra || null, color: u.color, sticky: keep.sticky }); } }
      fit();
    },
  };
}

/* ═══════════════════ 장면 만들기 ═══════════════════ */
const TEX = (() => {
  const c = document.createElement('canvas'); c.width = 4 * 32; c.height = 6 * 32; const g = c.getContext('2d');
  g.fillStyle = '#f4f1e8'; g.fillRect(0, 0, c.width, c.height);
  for (let j = 0; j < 6; j++) for (let i = 0; i < 4; i++) {
    if ((i + j) % 2 === 0) { g.fillStyle = '#232629'; g.fillRect(i * 32, j * 32, 32, 32); }
    else { g.fillStyle = '#232629'; g.fillRect(i * 32 + 8, j * 32 + 8, 16, 16); g.fillStyle = '#f4f1e8'; g.fillRect(i * 32 + 12, j * 32 + 12, 4, 4); g.fillRect(i * 32 + 16, j * 32 + 16, 4, 4); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; return t;
})();

/* 빌더. reveal = [시작 초, 길이 초]. 화살표·광선은 자라고(draw-on), 나머지는 투명도로 나타난다. 없으면 처음부터 놓여 있다 */
function sceneBuilder() {
  const G = new THREE.Group(), labels = [], pickables = [], anims = [], bb = new THREE.Box3();
  const V = p => new THREE.Vector3(p[0], p[1], p[2]);
  const grow = p => bb.expandByPoint(V(p));
  const col = c => c instanceof THREE.Color ? c : new THREE.Color(c.startsWith('--') ? css(c) : c);
  const colStr = c => typeof c === 'string' && !c.startsWith('--') ? c : css(c);
  const UP = new THREE.Vector3(0, 1, 0);
  const mats = obj => { const o = []; obj.traverse(x => { if (x.material) { const m = x.material; if (m.userData.base === undefined) m.userData.base = m.opacity; m.transparent = true; o.push(m); } }); return o; };
  const b = {
    G, labels, pickables, anims, bb, V,
    anim(fn) { anims.push(fn); },
    fade(obj, reveal, { out = false } = {}) {
      const ms = mats(obj);
      anims.push(t => { let k = prog(t, reveal); if (out) k = 1 - k; obj.visible = k > 0.001; ms.forEach(m => { m.opacity = m.userData.base * k; }); });
    },
    /* 나타났다가 사라진다: [시작, 나타나는 길이, 머무는 길이, 사라지는 길이] */
    pulse(obj, [s, din, hold, dout]) {
      const ms = mats(obj);
      anims.push(t => { const k = prog(t, [s, din]) * (1 - prog(t, [s + din + hold, dout])); obj.visible = k > 0.001; ms.forEach(m => { m.opacity = m.userData.base * k; }); });
    },
    label(text, pos, o = {}) { const l = { text, pos: V(pos), cls: o.cls, color: o.color, pin: !!o.pin, reveal: o.reveal || null }; labels.push(l); return l; },
    lines(pairs, color, { dashed = false, opacity = 1, reveal = null, r = 0.4 } = {}) {
      const P = pairs.map(([a, c]) => { grow(a); grow(c); return [V(a), V(c)]; });
      const sg = new Segs(G, col(color), { opacity, r, dashed }).update(P);
      if (reveal) anims.push(t => { const k = easeOut(prog(t, reveal)); sg.update(P.map(([a, c]) => [a, a.clone().lerp(c, k)])); sg.g.visible = k > 0; });
      return sg;
    },
    arrowDyn(a, c, color, { dashed = false, thick = false, head = null, opacity = 1 } = {}) {
      const C = col(color), g = new THREE.Group(); G.add(g);
      const shaftR = thick ? 0.85 : 0.42;
      let shaft = null, segs = null;
      if (dashed) segs = new Segs(g, C, { opacity, r: shaftR, dashed: true, dash: 4, gap: 2.5 });
      else { shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, 1, 8), new THREE.MeshBasicMaterial({ color: C, transparent: true, opacity })); g.add(shaft); }
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 12), new THREE.MeshBasicMaterial({ color: C, transparent: true, opacity }));
      g.add(cone);
      const A = new THREE.Vector3(), Bv = new THREE.Vector3(), dir = new THREE.Vector3(), end = new THREE.Vector3();
      let len = 0, h = 0, w = 0, frac = 1, opa = opacity;
      const api = {
        g,
        aim(p, q) {
          A.copy(V(p)); Bv.copy(V(q)); dir.copy(Bv).sub(A); len = dir.length(); if (len > 1e-6) dir.divideScalar(len);
          h = head ?? Math.min(len * 0.28, thick ? 10 : 7); w = thick ? h * 0.5 : h * 0.42;
          grow(p); grow(q); api.set(frac, opa); return api;
        },
        set(f, o = opa) {
          frac = f; opa = o; const L = len * f;
          g.visible = L > 0.3 && o > 0.005; if (!g.visible) return;
          const hh = Math.min(h, L), sl = Math.max(0, L - hh);
          end.copy(A).addScaledVector(dir, sl);
          if (segs) { segs.update([[A, end]]); segs.mat.opacity = o; segs.mat.transparent = true; }
          else { shaft.scale.set(1, Math.max(sl, 0.01), 1); shaft.position.copy(A).addScaledVector(dir, sl / 2); shaft.quaternion.setFromUnitVectors(UP, dir); shaft.material.opacity = o; }
          cone.scale.set(w / 2, hh, w / 2); cone.position.copy(end).addScaledVector(dir, hh / 2); cone.quaternion.setFromUnitVectors(UP, dir);
          cone.material.opacity = o;
        },
      };
      return api.aim(a, c);
    },
    arrow(a, c, color, o = {}) {
      const { reveal = null, ...rest } = o;
      const ar = b.arrowDyn(a, c, color, rest);
      if (reveal) anims.push(t => ar.set(easeOut(prog(t, reveal))));
      return ar;
    },
    dot(p, color, r = 2.6, info = null, { reveal = null } = {}) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 14), new THREE.MeshBasicMaterial({ color: col(color) }));
      m.position.copy(V(p)); G.add(m); grow(p);
      if (info) { m.userData = { ...info, color: colStr(color) }; pickables.push(m); }
      if (reveal) b.fade(m, reveal);
      return m;
    },
    quad(q, color, { opacity = 0.3, dashed = false, info = null, reveal = null } = {}) {
      const P = q.map(V); q.forEach(grow);
      const g = new THREE.Group(); G.add(g);
      const geo = new THREE.BufferGeometry().setFromPoints(P); geo.setIndex([0, 1, 2, 0, 2, 3]);
      const C = col(color);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: C, side: THREE.DoubleSide, transparent: true, opacity, depthWrite: false }));
      g.add(mesh);
      new Segs(g, C, { r: 0.35, dashed }).update(P.map((p, i) => [p, P[(i + 1) % 4]]));
      if (info) { const center = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(0.25); mesh.userData = { ...info, center, color: colStr(color) }; pickables.push(mesh); }
      if (reveal) b.fade(g, reveal);
      return g;
    },
    board(q, { opacity = 1, info = null, ghost = false, color = '--anchor', reveal = null } = {}) {
      if (ghost) return b.quad(q, color, { opacity: 0.08, dashed: true, info, reveal });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(q.flat(), 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      geo.setIndex([0, 1, 2, 0, 2, 3]);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: TEX, side: THREE.DoubleSide, transparent: true, opacity }));
      G.add(mesh); q.forEach(grow);
      const P = q.map(V);
      if (info) { const center = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(0.25); mesh.userData = { ...info, center, color: css(color) }; pickables.push(mesh); }
      if (reveal) b.fade(mesh, reveal);
      return mesh;
    },
    triad(o, axes, len, names, { cls = 'k' } = {}) {
      const cols = ['#c0392b', '#1e8449', '#1f5fb0'];
      axes.forEach((ax, i) => { const e = add(o, mul(unit(ax), len)); b.arrow(o, e, cols[i], { head: Math.min(5, len * 0.3) }); b.label(names[i], add(o, mul(unit(ax), len * 1.18)), { cls, color: cols[i], pin: true }); });
    },
  };
  return b;
}

/* 이미지 평면 위 격자(왜곡 계수에 따라 휜다) — [p, q] 쌍 목록 */
function gridPairs(c) {
  const N = 40, pairs = [];
  const poly = pts => { for (let i = 1; i < pts.length; i++) pairs.push([pts[i - 1], pts[i]]); };
  for (let u = 0; u <= IMG_W; u += 120) poly(Array.from({ length: N + 1 }, (_, i) => { const d = distortedPx(u, IMG_H * i / N, KC, c); return pxToDisp(d[0], d[1]); }));
  for (let v = 0; v <= IMG_H; v += 120) poly(Array.from({ length: N + 1 }, (_, i) => { const d = distortedPx(IMG_W * i / N, v, KC, c); return pxToDisp(d[0], d[1]); }));
  return pairs;
}

/* 비트별 장면. 같은 단계의 앞 비트에서 산출된 것은 다 놓인 채로 두고, 이 비트에서 산출되는 것만 reveal 을 단다 */
function buildScene(bt) {
  const b = sceneBuilder(), S = bt.stage, K = bt.key, V3 = b.V;
  const midOf = (a, c) => mul(add(a, c), 0.5);
  const picked = PICK;
  const nowIn = K;

  /* 먼저 있던 것: 광학 중심·카메라 좌표축·이미지 평면·시야·광축 */
  const condExtra = '초점·줌을 잠그고 K 파일에 같이 적는다 · 나중에 지금 값이 보정 당시와 다르면 K 무효';
  b.dot(C0, '--fg', 2.6, S === 1 || S === 6 ? { name: '촬영 조건', extra: condExtra } : { name: '광학 중심', extra: '카메라 좌표 원점 · 모든 광선이 지나는 점 · 높이 100 cm 에 둠' });
  if (S === 1) b.label('촬영 조건 고정', C0, { color: css('--fg'), reveal: [1.3, 0.5] });
  else if (S === 6) b.label('촬영 조건', C0, { color: css('--fg'), cls: K === 'file' ? '' : 'k', reveal: K === 'file' ? [1.1, 0.5] : null });
  else b.label('광학 중심', C0, { color: css('--fg'), cls: 'k' });
  b.triad(C0, [[1, 0, 0], [0, -1, 0], [0, 0, 1]], 40, ['X', 'Y', 'Z'], { cls: '' });
  const planeTip = S === 6
    ? { name: 'K 파일', extra: `K 4 + 왜곡 계수 5 · 재투영 RMS ${FILE.rms} px · 사진 ${FILE.views}장 · 가로 화각 ${FILE.hfov}° · 위치 보정의 PnP 와 측정의 undistortPoints 가 쓴다` }
    : { name: '이미지 평면', extra: `${IMG_W}×${IMG_H} px · 광학 중심에서 f 만큼 앞` };
  b.quad(PLANE, '--plane', { opacity: 0.12, info: planeTip });
  const fileLbl = S === 6;
  b.label(fileLbl ? 'K 파일' : '이미지 평면', midOf(PLANE[0], PLANE[1]), { color: css('--plane'), cls: fileLbl ? '' : 'k', reveal: K === 'file' ? [1.9, 0.5] : null });
  b.lines(PLANE.map(k => [C0, k]), '--muted', { opacity: 0.5, r: 0.3, reveal: S === 1 ? [0.2, 1.0] : null });
  b.lines([[C0, PP]], '--plane', { r: 0.35 });
  b.lines([[PP, camToDisp(0, 0, 330)]], '--plane', { dashed: true, opacity: 0.5, r: 0.3 });

  /* 이미지 평면 위 격자 — 사진은 왜곡된 채 찍히므로 늘 휘어 있다. 4 단계 첫 추정에서만 펴졌다가 맞추기에서 다시 휜다 */
  const grid = b.lines(gridPairs(gridCoefAt(bt, 0)), '--gridline', { opacity: 0.4, r: 0.22 });
  if (K === 'init' || K === 'fit') b.anim(t => grid.update(gridPairs(gridCoefAt(bt, t)).map(([p, q]) => [V3(p), V3(q)])));

  const info = p => ({ name: '촬영 자세', extra: poseInfo(p) });
  const rays = p => p.quad.map(q => [C0, q]);
  const ghosts = () => POSES.forEach(p => { if (p !== picked) b.board(p.quad, { ghost: true, color: '--grid' }); });
  const cornerInfo = cn => ({ name: '보드 코너', extra: `(${cn.i}, ${cn.j}) · 보드 좌표 (${cn.i * 90}, ${cn.j * 90}, 0) mm` });
  const pixInfo = (cn, q) => ({ name: '검출 픽셀', extra: `(${cn.i}, ${cn.j}) · (${fmt(q.uv[0], 1)}, ${fmt(q.uv[1], 1)}) px` });

  /* 구한 K 를 그림으로 — 초점거리 f, 주점, 이미지 가운데와의 차이 */
  const kVisuals = ({ labels = true, reveal = false, thin = false } = {}) => {
    const rv = (a, d) => reveal ? [a, d] : null;
    b.arrow(C0, PP, '--plane', { thick: !thin, reveal: rv(0, 1.2) });
    b.dot(PP, '--pp', thin ? 1.6 : 2.2, { name: '주점', extra: `광축이 이미지 평면과 만나는 픽셀 · (${fmt(KC.cx, 2)}, ${fmt(KC.cy, 2)}) px` }, { reveal: rv(1.2, 0.4) });
    if (!labels) return;
    b.label('초점거리', midOf(C0, PP), { color: css('--plane'), reveal: rv(1.1, 0.4) });
    b.label('주점', PP, { color: css('--pp'), reveal: rv(1.4, 0.4) });
    const cs = 5;
    const crossSg = b.lines([[[CTR[0] - cs, CTR[1], CTR[2]], [CTR[0] + cs, CTR[1], CTR[2]]], [[CTR[0], CTR[1] - cs, CTR[2]], [CTR[0], CTR[1] + cs, CTR[2]]]], '--ideal', { opacity: 0.9, r: 0.3 });
    if (reveal) b.fade(crossSg.g, [1.9, 0.5]);
    b.dot(CTR, '--ideal', 1.5, { name: '이미지 가운데', extra: '(960, 600) px' }, { reveal: rv(1.9, 0.5) });
    b.label('이미지 가운데', CTR, { color: css('--ideal'), cls: 'k', reveal: rv(2.1, 0.4) });
    b.lines([[PP, CTR]], '--pp', { r: 0.3, reveal: rv(2.4, 0.6) });
  };

  /* 2 촬영: 보드를 시야 안 여러 자리·기울기로 찍는다 */
  if (S === 2) {
    const first = POSES[0];
    if (K === 'board') {
      b.board(first.quad, { opacity: 0.55, info: info(first), reveal: [0.2, 0.5] });
      b.lines(rays(first), '--anchor', { opacity: 0.5, r: 0.3, reveal: [0.6, 0.9] });
      b.label('보드 자세', first.center, { color: css('--anchor'), reveal: [1.4, 0.4] });
    } else {

    outline(picked, anchor, false, 1.2);
    const det = picked.corners.map(cn => toPix(cn.p, KC, COEF));
    const detA = S === 3 ? (K === 'pixels' ? a([1.0, 0.5]) : 0) : 1;

    POSES.forEach(p => {

      if (K === 'split') { outline(p, anchor, false, 1, 1 - a([0.6, 0.8])); outline(p, est, true, 1.2, a([1.0, 0.6])); }

{

addEventListener('hashchange', () => { const st = stageFromHash(); if (st) goto(BEATS.findIndex(x => x.stage === st)); });
if (RENDER) {
  window.__beats = BEATS.map(x => ({ stage: x.stage, dur: x.dur, name: x.name }));
  window.__seek = (i, t, fresh = false) => { if (i !== state.i || fresh) goto(i, { fresh }); state.t = t; render(t, t * 1000); renderProgress(); };
  goto(0, { fresh: true });
  document.fonts.ready.then(() => { window.__ready = true; });
} else {
  const st = stageFromHash();
  goto(st ? BEATS.findIndex(x => x.stage === st) : 0, { play: !RM });
  /* 끼워 넣기: 화면 밖으로 나가면 멈추고, 돌아오면 이어서 돈다(한 페이지에 애니메이션 다섯이 같이 돌지 않게) */
  if (EMBED && 'IntersectionObserver' in window && !RM) {
    let seen = true;
    new IntersectionObserver(es => {
      const on = es.some(e => e.isIntersecting);
      if (on === seen) return; seen = on;
      if (on) { if (!state.playing) { state.playing = true; renderControls(); ensureLoop(); } }
      else if (state.playing) { state.playing = false; renderControls(); }
    }, { threshold: 0.05 }).observe(document.body);
  }
}
</script>
